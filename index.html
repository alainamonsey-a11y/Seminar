  growAll(); }
/* oral exams: the professor asks, you answer out loud (or type), it follows up, then grades */
function oralState(cid,which){ const c=cstate(cid); c.orals=c.orals||{}; return c.orals[which]=c.orals[which]||{turns:[],asked:0,_t:0}; }
function oralScope(course,which){ if(which==="final") return `the whole course`; const w=parseInt(which.slice(1))-1; const from=w*7,to=Math.min(24,from+6); return `Week ${w+1}, ${course.weeks[w].title}: classes ${from+1}–${to+1} (${course.classes.slice(from,to+1).map(k=>k.title).join("; ")})`; }
function oralSystem(course,which){ return professorSystem(course,null)+`\n\nThis is a spoken oral examination on ${oralScope(course,which)}. Ask one question at a time, as you would across a table: short, specific, answerable in a minute or two of talking. Three main questions in all; after each answer, either follow up once to press on evidence or a weak point, or move to the next question. Keep every turn under 90 words and in plain spoken prose with no markdown, no lists, no headings. Her answers are spoken and transcribed, so ignore disfluencies and transcription errors entirely and judge the substance.`; }
async function oralNext(course,which){ const o=oralState(course.id,which); const sys=oralSystem(course,which); const hist=o.turns.map(t=>({role:t.role==="you"?"user":"assistant",content:t.text})); let msgs;

  else { const l=hist[hist.length-1]; if(l.role!=="user") throw new Error("SHAPE"); const asked=o.asked||0, follow=o.follow||0; const note=asked>=3&&follow>=1?`That was the last answer. Say a one- or two-sentence close and stop.`:(asked>=3?`That was the answer to the third and last main question. Either follow up once, or close with a sentence or two.`:`${asked} of 3 main questions asked so far. ${follow?"You have already followed up on this one; move to the next main question.":"Either follow up once on this answer, or move to the next main question."}`);
    msgs=[...hist.slice(0,-1),{role:"user",content:l.content+`

[Examiner note: ${note} Return JSON only: {"say":"what you say next","kind":"question"|"followup"|"close"}]`}]; }
  const out=await claude(sys,msgs,{json:true,max:600}); const say=str(out&&out.say).trim(); let kind=str(out&&out.kind).trim().toLowerCase(); if(!say) throw new Error("SHAPE"); if(!["question","followup","close"].includes(kind)) kind=(o.asked||0)>=3?"close":"question";

async function oralGrade(course,which){ const o=oralState(course.id,which); const sys=oralSystem(course,which); const transcript=o.turns.map(t=>`${t.role==="you"?"STUDENT":"EXAMINER"}: ${t.text}`).join("\n\n");
  const user=`The oral examination is over. Grade it 0–100 with a letter, on substance only: accuracy, use of specific evidence from the sources, and the quality of reasoning under questioning. Ignore transcription errors and spoken disfluency.\n\nTRANSCRIPT:\n${transcript}\n\nReturn JSON only, with every line break inside a string written as \\n: {"score":82,"letter":"B","feedback":"markdown, 120–200 words","strengths":["..."],"improvements":["..."]}`;

function oralScores(cid){ const c=cstate(cid); return Object.values(c.orals||{}).filter(o=>typeof o.score==="number").map(o=>o.score); }
function renderOral(course,which){ const o=oralState(course.id,which); const label=which==="final"?"Final oral":"Week "+which.slice(1)+" oral"; bar(`${esc(course.title)} · <b>${label}</b>`,course); const key=getKey(); const graded=typeof o.score==="number"; const voice=!(S.ui&&S.ui.voice===false);

/* threads: #tags written inside notes, quotations, and debate answers, gathered across every course */
const TAGRE=/(^|[^\w#])#([a-z][a-z0-9_-]{1,30})/gi;
function tagsIn(text){ const out=new Set(); let m; const re=new RegExp(TAGRE.source,"gi"); while((m=re.exec(String(text||"")))) out.add(m[2].toLowerCase()); return [...out]; }
function allThreadItems(){ const items=[]; for(const c of COURSES){ const cs=cstate(c.id); const src=cs.sources||{};
    for(const n of Object.keys(src)){ const s=src[n]; Object.entries(s.entries||{}).forEach(([i,t])=>{ tagsIn(t).forEach(tag=>items.push({tag,c,i:+i,kind:"note",src:n,text:t})); }); Object.entries(s.items||{}).forEach(([i,m])=>Object.entries(m).forEach(([id,t])=>{ tagsIn(t).forEach(tag=>items.push({tag,c,i:+i,kind:"note",src:n,text:t,label:itemLabel(c,+i,id)})); })); }
    liveQuotes(c.id).forEach(q=>{ tagsIn(q.text+" "+q.cite).forEach(tag=>items.push({tag,c,i:q.i,kind:"quotation",src:q.src,text:q.text,cite:q.cite})); });
    Object.entries(cs.debates||{}).forEach(([q,d])=>{ tagsIn(d.text).forEach(tag=>items.push({tag,c,i:null,kind:"debate",src:(debateQs(c)[q]||"").slice(0,80),text:d.text})); }); }
  return items; }

  $("#app").innerHTML=`<div class="lead"><div class="k" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase"><a href="#/">← Home</a></div><h1>Threads</h1><p>Write a tag like <b>#plague</b> or <b>#succession</b> anywhere in a note, a quotation, or a debate answer, and everything with that tag gathers here across all the courses. Threads are how the capstones get written: two years of reading, sorted by the questions you kept asking.</p></div>

/* transcript: the whole sequence on one printable page */
function renderTranscript(){ bar(`<b>Transcript</b>`); let totalWords=0, essays=0, quotes=0; const ncards=Object.keys(cards()).length; const {all}=logTotals();
  const rows=COURSES.map(c=>{ const cs=cstate(c.id); const g=courseGrade(c.id); const done=courseProgress(c.id); let w=0,e=0; for(let i=0;i<25;i++){ const k=cs.classes[i]; if(!k) continue; [k.assign,k.hw].forEach(r=>{ if(r&&typeof r.score==="number"){ e++; w+=words(r.answer); } }); } Object.values(cs.sources||{}).forEach(s=>{ w+=sourceWords(s); }); const q=liveQuotes(c.id).length; totalWords+=w; essays+=e; quotes+=q; const or=oralScores(c.id); const fin=examScore(cs.exams.final);
    return {c,done,g,e,w,q,or:or.length?avg(or):null,fin,status:done===25&&fin!=null?"Complete":((done||lastActivity(c.id)||or.length)?"In progress":"Not begun")}; });
  const caps=Object.entries(S.capstones||{}).filter(([id,r])=>typeof r.score==="number");
  $("#app").innerHTML=`<div class="lead"><div class="k noprint" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase"><a href="#/">← Home</a></div><h1>Transcript</h1><p>${STUDENT} · The Seminar, a reading course in world history · ${rows.filter(r=>r.status==="Complete").length} of ${rows.length} courses complete${all?` · ${hm(all)} logged`:""}</p><div class="row noprint" style="margin-top:10px"><button class="btn small" id="print">Print</button></div></div>
  <table class="g"><thead><tr><th>Course</th><th>Status</th><th>Classes</th><th>Written work</th><th>Final exam</th><th>Orals</th><th>Grade</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="#/c/${r.c.id}">${esc(r.c.title)}</a><div class="hint">${esc(r.c.subtitle)}</div></td><td>${r.status}</td><td>${r.done}/25</td><td>${r.e?`${r.e} pieces, ${r.w.toLocaleString()} words`:"—"}</td><td>${r.fin!=null?`${Math.round(r.fin)} · ${letter(r.fin)}`:"—"}</td><td>${r.or!=null?`${Math.round(r.or)} · ${letter(r.or)}`:"—"}</td><td><b>${r.g.overall!=null?`${letter(r.g.overall)}`:"—"}</b>${r.g.overall!=null?` <span class="hint">${Math.round(r.g.overall)}</span>`:""}</td></tr>`).join("")}</tbody></table>
  <section class="sec"><h3>Capstone essays</h3>${caps.length?`<table class="g"><tbody>${caps.map(([id,r])=>{ const cap=CAPSTONES.find(x=>x.id===id)||{title:id}; return `<tr><td>${esc(cap.title)}</td><td>${fmtDate(r.at)}</td><td>${words(r.answer)} words</td><td><b>${esc(r.letter||letter(r.score))}</b> <span class="hint">${Math.round(r.score)}</span></td></tr>`; }).join("")}</tbody></table>`:`<p class="hint">None graded yet.</p>`}</section>
  <section class="sec"><h3>In all</h3><p>${essays} graded pieces of written work and ${totalWords.toLocaleString()} words of writing and notes; ${quotes} quotations saved; ${ncards} review cards made.</p></section>`;
  $("#print").onclick=()=>window.print(); }

installCustom(); migrate(); applyTextSize(); route(); if(ghToken()) syncNow();
window.SEMINAR={state:()=>S,courses:COURSES,nav,merge:mergeStates,sync:syncNow,cards,dueCards,classDone,courseGrade};
})();

</script>
</body>
</html>
