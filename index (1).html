<title>The Seminar</title>
<style>
:root{
  --paper:#F3F0E8; --paper-2:#EAE6DB; --ink:#1C1B18; --ink-2:#55524A; --ink-3:#8C887D; --rule:#CFCABD;
  --red:#A63D2F; --blue:#3C5A7A; --ochre:#B8892B; --green:#4E6B4A; --plum:#6B4A5E;
  --accent:var(--blue);
  --font:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-weight:500;line-height:1.2;letter-spacing:-.01em}
.sr{position:absolute;left:-9999px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:52px}
.bar .mark{width:14px;height:14px;background:var(--accent);flex:none}
.bar .mark.circle{border-radius:50%}
.bar .mark.tri{width:0;height:0;background:none;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid var(--accent)}
.bar .crumb{flex:1;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .crumb b{color:var(--ink);font-weight:500}
.bar button{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:6px 0}
.bar button:hover{color:var(--ink)}

.wrap{max-width:860px;margin:0 auto;padding:22px 18px 80px}

/* home */
.hero{padding:26px 0 18px;border-bottom:1px solid var(--ink)}
.hero h1{font-size:34px;font-weight:400}
.hero p{color:var(--ink-2);max-width:60ch;margin-top:10px}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:22px}
.course{background:var(--paper);padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;min-height:150px;position:relative}
.course:hover{background:var(--paper-2)}
.course .n{font-size:12px;letter-spacing:.1em;color:var(--ink-3)}
.course h3{font-size:20px;font-weight:500}
.course .sub{font-size:13px;color:var(--ink-2)}
.course .shape{position:absolute;right:16px;top:16px;width:18px;height:18px;background:var(--c)}
.course .shape.circle{border-radius:50%}
.course .shape.tri{width:0;height:0;background:none;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:18px solid var(--c)}
.course .prog{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2)}
.pbar{flex:1;height:4px;background:var(--rule);position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--accent))}

/* course page */
.lead{padding:22px 0 16px;border-bottom:1px solid var(--rule)}
.lead h1{font-size:30px;font-weight:400}
.lead .sub{color:var(--ink-2);margin-top:4px}
.lead p{margin-top:12px;max-width:70ch}
.spine{margin-top:14px;font-size:13px;color:var(--ink-2);display:grid;gap:3px}
.spine div::before{content:"—";margin-right:8px;color:var(--ink-3)}
.week{margin-top:26px}
.week h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:6px}
.week h2 span{font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink)}
.week .wintro{margin:10px 0 8px;color:var(--ink-2);font-size:14px;max-width:70ch}
.cls{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rule)}
.cls:hover{background:var(--paper-2);margin:0 -8px;padding-left:8px;padding-right:8px}
.cls .num{width:34px;flex:none;font-size:12px;letter-spacing:.08em;color:var(--ink-3);padding-top:3px}
.cls .t{flex:1}
.cls .t h4{font-size:16px;font-weight:500}
.cls .meta{display:flex;gap:10px;margin-top:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.cls .meta b{font-weight:500;color:var(--ink-2)}
.cls .meta .on{color:var(--accent)}
.cls .done{width:12px;height:12px;border:1px solid var(--ink-3);flex:none;margin-top:6px}
.cls .done.y{background:var(--ink);border-color:var(--ink)}
.exam-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule);font-size:14px}
.exam-row .lbl{letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--ink-2)}
.exam-row .score{font-variant-numeric:tabular-nums}

/* class page */
.chead{padding:20px 0 14px;border-bottom:1px solid var(--ink)}
.chead .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.chead h1{font-size:26px;font-weight:400;margin-top:4px}
.chead .nav{display:flex;gap:18px;margin-top:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.chead .nav a{color:var(--ink-2)} .chead .nav a:hover{color:var(--ink)}
.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule);margin-top:0;position:sticky;top:52px;background:var(--paper);z-index:10;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 14px 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;position:relative}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.panel{padding:20px 0}
.sec{margin-bottom:22px}
.sec h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.mat{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rule)}
.mat .box,.mi .box{width:16px;height:16px;border:1px solid var(--ink);flex:none;margin-top:3px;cursor:pointer;background:transparent;padding:0;border-radius:0}
.mat .box.y,.mi .box.y{background:var(--ink)}
.mat .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);width:64px;flex:none;padding-top:4px}
.mat .x{flex:1}
.sh2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mgrp{margin-top:14px} .mgrp:first-of-type{margin-top:4px}
.mghead{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.mghead .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)} .mghead .minb{margin-left:auto}
.mlist{list-style:none;margin:0;padding:0}
.mi{padding:10px 0;border-bottom:1px solid var(--rule)}
.mirow{display:flex;gap:12px;align-items:flex-start}
.mix{flex:1;min-width:0}
.mit{font-size:15px;line-height:1.45}
.mi.y .mit{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule)}
.mim{display:flex;gap:12px;align-items:baseline;margin-top:3px;flex-wrap:wrap}
.misrc{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.minb{font-size:12px;color:var(--ink-2);border-bottom:1px dotted var(--ink-3);padding:0;background:none;cursor:pointer}
.minotes{margin:8px 0 2px 28px} .minotes .ta.small{min-height:70px}
.cls .meta .qc.part{color:var(--ink)}
.srci{margin:8px 0 4px} .srcl{font-size:12px;color:var(--ink-2);margin:8px 0 4px;line-height:1.4}
.note{background:var(--paper-2);padding:14px 16px;font-size:14px;color:var(--ink-2);border-left:2px solid var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--ink);font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)} .btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{border-color:var(--rule);color:var(--ink-2)} .btn.ghost:hover{background:var(--paper-2);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.small{padding:6px 10px;font-size:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea.ta{width:100%;min-height:160px;padding:12px;border:1px solid var(--rule);background:#fff;resize:vertical;line-height:1.55}
textarea.ta:focus{outline:none;border-color:var(--ink)}
.ta.small{min-height:90px}
.prose{max-width:70ch;line-height:1.6}
.prose p{margin:0 0 10px} .prose h1,.prose h2,.prose h3{margin:16px 0 8px;font-size:16px;font-weight:600} .prose ul,.prose ol{margin:0 0 10px 20px} .prose li{margin-bottom:4px} .prose blockquote{border-left:2px solid var(--rule);padding-left:12px;color:var(--ink-2);margin:0 0 10px} .prose code{font-family:var(--mono);font-size:13px}
.q{padding:16px 0;border-bottom:1px solid var(--rule)}
.q .qt{font-size:16px;margin-bottom:10px}
.thread{margin-top:10px;display:grid;gap:10px}
.msg{padding:12px 14px;font-size:14px}
.msg.me{background:#fff;border:1px solid var(--rule)}
.msg.prof{background:var(--paper-2);border-left:2px solid var(--accent)}
.msg .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.grade{display:flex;gap:18px;align-items:baseline;padding:14px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin:14px 0}
.grade .big{font-size:34px;font-weight:300}
.grade .pct{font-size:14px;color:var(--ink-2)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer}
.opt .r{width:14px;height:14px;border:1px solid var(--ink);border-radius:50%;flex:none;margin-top:4px}
.opt.sel .r{background:var(--ink)}
.opt.right .r{background:var(--green);border-color:var(--green)}
.opt.wrong .r{background:var(--red);border-color:var(--red)}
.expl{font-size:13px;color:var(--ink-2);padding:6px 0 0 26px}
.empty{color:var(--ink-3);font-size:14px;padding:18px 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.status{font-size:13px;color:var(--ink-2);margin-top:8px}
.err{color:var(--red);font-size:13px;margin-top:8px}


.src{padding:12px 0 10px;border-bottom:1px solid var(--rule)}
.src .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px}
.src .nm{font-size:14px;font-weight:500;text-align:left;border-bottom:1px dotted var(--ink-3);padding:0}
.src .cnt{font-size:12px;color:var(--ink-3)} .src .cnt a{text-decoration:underline}
.lnk{font-size:12px;color:var(--ink-2);text-decoration:underline}
.nbe{margin:10px 0 14px} .nbk{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}


/* v2 additions */
.pill{display:inline-block;min-width:16px;padding:0 5px;background:var(--accent);color:var(--paper);font-size:10px;font-style:normal;line-height:16px;border-radius:8px;text-align:center}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rule);margin-left:4px;vertical-align:middle}
.syncdot.ok{background:var(--green)} .syncdot.busy{background:var(--ochre)} .syncdot.err{background:var(--red)} .syncdot.off{background:transparent;border:1px solid var(--rule)}

  lead: `From the Bronze Age palaces to the Roman conquest: Homer, the polis, Persia, Athens, Thucydides, Alexander, and the Hellenistic world. The Greeks wrote the first histories, and Herodotus, Thucydides, Xenophon, Plato, and Arrian are not just evidence but the thing itself.`,
  spine: [`Robin Waterfield, Creators, Conquerors, and Citizens — the one-volume narrative`, `Tom Holland, Persian Fire — the Persian Wars, Week 2`, `Donald Kagan, The Peloponnesian War — Week 3`, `Ryan Stitt, The History of Ancient Greece podcast; Donald Kagan's Yale lectures (Open Yale Courses)`],
  weeks: [
    { title: "Before the polis, and the first cities", intro: `From the Bronze Age palaces to Cleisthenes' reforms of 508 BC. What was it about these small, poor, quarrelsome towns that produced everything that followed?`, note: `Two things to watch for. First, the gap: Linear B tablets stop around 1200 BC and Greek writing does not reappear until about 750 BC, so Homer describes a world four centuries gone. Second, Sparta and Athens solved the same crisis, too many hungry people, too much debt, aristocrats losing control, in opposite ways, and everything in Weeks 2 and 3 follows from that.` },
    { title: "Persia and the Golden Age", intro: `The Persian Wars (499–479 BC) and the fifty years after them, when Athens turned an alliance into an empire and spent the proceeds on the Parthenon.`, note: `Herodotus and Thucydides are the two ways of writing history, invented a generation apart, and you are reading both this week. Herodotus collects stories and tells you which he believes. Thucydides cuts the stories out and tells you what the power relations were. Notice which one you trust more, and why; that is the methods question for the whole month.` },
    { title: "The Peloponnesian War and the fourth century", intro: `Thucydides is the main text for five days, with Kagan alongside. The war ends with Athens defeated and Socrates executed; the fourth century is the Greeks failing to find anything better and Macedon walking in.`, note: `The Mytilenean debate and the Melian dialogue are the two passages everyone argues about, and for good reason: they are the earliest surviving arguments about whether power has any obligations at all. Read them slowly. Thucydides never says what he thinks, which is the point.` },
    { title: "Alexander and after", intro: `Alexander, the kingdoms his generals carved out of his empire, and the Romans arriving to take them. The last class lands on Polybius and Flamininus, where the Rome course picked up.`, note: `The line to carry out of the month is Horace's: captive Greece took her savage captor captive. By the end you will have read enough of both sides to decide how true that is.` }
  ],

{
  id: "byzantium", order: 3, title: "Byzantium", subtitle: "330 – 1453",
  lead: `The Roman state that did not fall for another thousand years, from Constantine's founding of Constantinople to Mehmed II at the walls. The people in it called themselves Romans the whole time; one of the running questions is what the later name hides.`,
  spine: [`John Julius Norwich, A Short History of Byzantium — the narrative, read throughout`, `Judith Herrin, Byzantium: The Surprising Life of a Medieval Empire — thematic companion`, `Peter Sarris, Justinian — Week 1; Jonathan Harris, Byzantium and the Crusades — Week 3; Roger Crowley, 1453 — Week 4`, `Robin Pierson, The History of Byzantium podcast — the single best resource`],
  weeks: [
    { title: "Constantine to Heraclius, 330–641", intro: `The East survives the century that killed the West, then under Justinian tries to take the West back. The week ends with Heraclius winning the last Roman-Persian war and, within a decade, losing Syria and Egypt to an army nobody had seen coming.`, note: `The week's argument is Sarris versus Procopius. Procopius served Justinian for years and then wrote the most venomous attack on a ruler in ancient literature. Sarris takes him seriously and still ends up admiring the emperor. Decide where you land; it is the same question you asked about Livy and Augustus.` },
    { title: "Survival and revival, 641–1025", intro: `The empire loses two-thirds of its territory in a decade, holds the capital through two Arab sieges, reinvents its army and its provinces, tears itself apart over icons, and comes out the other side as the richest state in Christendom.`, note: `Iconoclasm is the week's hard problem. The sources were all written by the winners, after 843, and the iconoclast emperors who won every war and saved the state survive only as villains. Kaldellis and Herrin both think the traditional story is mostly a later fabrication. Read John of Damascus first so you know what the iconophiles were actually arguing, then decide how much of the heresy you believe happened.` },
    { title: "Collapse and the Komnenoi, 1025–1204", intro: `Fifty years after Basil II the empire has lost Anatolia at Manzikert and southern Italy to the Normans. Alexios Komnenos rebuilds it with mercenaries, marriage, and a request to the Pope that becomes the First Crusade. A century later the Fourth Crusade burns the city.`, note: `The sack of 1204 is the class to clear your morning for: three eyewitnesses to the same four days, a French marshal, a French knight, and a Byzantine senator, and they do not describe the same event. Villehardouin thinks it was God's judgment. Robert of Clari cannot get over the size of the city. Choniates watched his house burn. Hold them side by side the way you held Beard and Livy.` },
    { title: "The long ending, 1204–1453", intro: `The exiles at Nicaea take the city back in 1261, the Palaiologoi preside over a cultural flowering and a political collapse, the Ottomans surround what is left, and the last emperor dies on the walls.`, note: `The closing question is the name. The people on the walls in 1453 called themselves Romans, their Ottoman conquerors called the country Rum, and the word Byzantine was coined a century later by a German scholar who wanted a Roman Empire that ended in 476. Kaldellis argues the name is a thousand-year theft. You are in a position to say whether he is right.` }

{

  lead: `From Osman's frontier band to the abolition of the sultanate: the conquerors who inherited Constantinople, the title of Caesar, and the problem of holding the Balkans and Anatolia together, and what they did with all of it.`,
  spine: [`Marc David Baer, The Ottomans: Khans, Caesars, and Caliphs — the narrative, read throughout`, `Caroline Finkel, Osman's Dream — reference narrative`, `Roger Crowley, Empires of the Sea — Week 2; Andrew Wheatcroft, The Enemy at the Gate — Week 3; Eugene Rogan, The Fall of the Ottomans — Week 4`, `Empire podcast (Dalrymple and Anand), the Ottoman season; Ottoman History Podcast`],
  weeks: [
    { title: "From Osman to the Conqueror, 1300–1481", intro: `A frontier band in northwest Anatolia becomes, in five generations, the state that takes Constantinople. Why these people, out of a dozen rival beyliks, and why did the catastrophe of 1402, which should have ended them, not?`, note: `The source to argue with is Mihailović. He was a Serbian Christian captured as a boy, served Mehmed as a janissary, escaped, and wrote the only insider's account of the early Ottoman army we have; he is also writing for a Polish Christian audience that wants to hear the Turks are beatable. Read him the way you read Procopius.` },
    { title: "The classical age, 1481–1600", intro: `In forty years the empire doubles: Selim takes the Arab lands and the holy cities, Suleiman takes Belgrade, Rhodes, and Hungary and stands outside Vienna. Also the machine itself, and the court: Hürrem, the harem, and the fratricide law.`, note: `Busbecq is the week's great source. He spent seven years as Habsburg ambassador, half of it under house arrest, and wrote the first careful European account of how the Ottoman state promoted on merit. His admiration is the thing to interrogate: he is writing home to argue that the Habsburgs should copy the Turks, and that shapes what he chooses to see.` },
    { title: "The long middle, 1600–1830", intro: `Two centuries that used to be called the decline and are now called something else by every working historian, without agreement on what. The job is to decide whether decline is the right word, and if not, what was actually happening.`, note: `The Greek War of Independence from the side nobody reads: not the birth of modern Hellas but a provincial revolt that Britain, France, and Russia decided to win for ideological reasons, at a cost to the Ottoman order that Istanbul understood exactly. Both accounts can be true.` },
    { title: "Reform and ruin, 1830–1923", intro: `The Tanzimat tries to make Ottoman subjects into citizens, Abdülhamid tries autocracy and pan-Islam, the Young Turks try nationalism, and the Great War destroys all three.`, note: `The hardest reading of the year, with sources deliberately uneven: an American ambassador's secondhand account beside an Armenian priest's memoir of the deportations he survived. Rogan sets both in the war that produced them without excusing anything. The closing question is Baer's: was this a European empire whose history is also Europe's?` }

  lead: `The control case. China developed its writing, its philosophy, its empire, and its historians with almost no contact with the Mediterranean world, and arrived at a state that looks startlingly like Rome's, at the same moment. Which of the things you believed about why Rome worked survive contact with a case that owes it nothing?`,
  spine: [`Mark Edward Lewis, the Harvard History of Imperial China: Qin and Han, China Between Empires, China's Cosmopolitan Empire — Weeks 2–4`, `John Keay, China: A History, ch. 1–9 — the through-narrative`, `Li Feng, Early China — Week 1; Bryan Van Norden, Introduction to Classical Chinese Philosophy — the thinkers; Walter Scheidel, Escape from Rome — the capstone`, `Chris Stewart, The History of China podcast; Harvard's ChinaX lectures`],
  weeks: [
    { title: "Shang and Zhou, the philosophers, and the First Emperor, 1200–206 BC", intro: `A thousand years in seven classes: kings who asked the future of cracked bones, the Mandate of Heaven, five centuries of war in which every school of Chinese thought was founded, and the man who ended the war by abolishing everything before him.`, note: `The comparison is the Analects against Plato's Apology. Both are students' records of a teacher who wrote nothing and became the foundation of a civilization's idea of the good life; they could not be more different in what they think the good life is. Notice what kind of question Confucius refuses to answer that Socrates cannot stop asking.` },
    { title: "The Han, 206 BC – AD 220", intro: `Rome's exact contemporary: founded by a peasant the year after Zama, expanded by a warrior-emperor, given its orthodoxy by a historian the emperor castrated, and destroyed by eunuchs, generals, and a peasant religion in the same decades the Roman Empire was coming apart.`, note: `Sima Qian chose castration over death so he could finish his father's history, then wrote a hundred and thirty chapters that invented the form every later Chinese historian followed, and let his contempt for the emperor who mutilated him show in every chapter about him. The Letter to Ren An is the closest thing in ancient literature to a historian explaining why he does it.` },
    { title: "Disunion, Buddhism, and the Tang, 220–755", intro: `Three and a half centuries of division, in which nomads rule the north, aesthetes rule the south, and an Indian religion conquers both; then a reunification that holds. This is where China's story diverges from Rome's: the barbarian kingdoms became Chinese, and the empire came back.`, note: `Christianity conquered Rome from inside, as the religion of the poor and then the emperors; Buddhism entered China from outside, through merchants and monks, as a foreign philosophy that the nomad rulers of the north adopted partly because it was not Confucian. Both took three centuries, and both ended up state religions the state later turned on. Notice what travelled and what did not.` },
    { title: "An Lushan and the long fall, 755–907", intro: `The rebellion that broke the Tang in a winter, the poet who walked through the ruins, the century and a half of recovery and decay that followed, and a last class on the question the whole month has been circling.`, note: `Scheidel's argument is that Rome's failure to return was the most important fact in world history: because no empire could reunify Europe, its fragments competed, and competition produced the modern world; China reunified every time and did not. You are one of a small number of people who have read both halves of the comparison from the sources.` }

  lead: `Japan took writing, Buddhism, Confucianism, and its idea of the state from the Tang, then spent a thousand years turning each into something the Tang would not have recognized. The literature is written mostly by women, the warriors win and the court survives anyway, and a country shuts its doors for two centuries and comes out richer.`,
  spine: [`Christopher Harding, The Japanese: A History in Twenty Lives — the narrative, read throughout`, `Conrad Totman, A History of Japan — reference`, `Ivan Morris, The World of the Shining Prince — Week 1; Pierre Souyri, The World Turned Upside Down — Week 2; Mary Elizabeth Berry, Hideyoshi — Week 3; Marius Jansen, The Making of Modern Japan — Weeks 3–4`, `Justin Hebert, A History of Japan; Isaac Meyer, History of Japan Podcast`],
  weeks: [
    { title: "Yamato, Nara, and Heian, 240–1156", intro: `Japan enters history in a Chinese chronicle, borrows everything the Tang has to offer, and within three centuries has a court where the men write bad Chinese poetry and the women write the first great novel in the world.`, note: `Murasaki against Procopius, Psellos, and Anna Komnene: all four wrote about the court from inside it, all four knew exactly what they were leaving out, and only one of them wrote a novel. The Genji tells you more about how power actually worked at Heian than any chronicle, through a story in which almost nothing political ever happens; work out how.` },
    { title: "The warriors, 1156–1467", intro: `The Taira win the capital and lose the country; the Minamoto build a second government at Kamakura; the Mongols come twice and the wind takes them; an emperor tries to rule for real and fails; and the Ashikaga preside over the greatest age of Japanese art while the country slides into civil war.`, note: `The Heike is the one Japanese text to set against the Iliad. Both are oral epics of a war written down later; both are about the destruction of a proud house; and the Heike opens with the line every Japanese schoolchild knows, that the bell of Gion Temple tolls the impermanence of all things. The Iliad has no such line. That difference is Buddhism.` },
    { title: "Sengoku and the Tokugawa settlement, 1467–1700", intro: `A century with no central government, Portuguese ships bringing guns and Jesuits, and three men in succession reunifying the country: one brutal, one brilliant, one patient. Then the patient one's family closes the doors.`, note: `Xavier and Fróis were the first Europeans to describe Japan, and they were astonished: a literate, courteous, proud people who could not be converted by force and would not be impressed by poverty. The Jesuits in Japan are the only European outsiders you have read who were, for a generation, winning. Then Hideyoshi noticed.` },
    { title: "Edo and the end, 1700–1868", intro: `The culture of a country at peace with itself and sealed from everyone else, the thinkers who argued about what Japan was, the American ships that ended the argument, and the fifteen years in which the shogunate fell.`, note: `Japan and the Ottomans both met the industrial West in the same decade, both had a reforming faction and a reactionary one, both wrote constitutions. One became a great power in a generation and the other was partitioned. Decide whether Jansen's answer explains the difference, or describes it.` }

  spine: [`John Keay, India: A History — the narrative, read throughout`, `Romila Thapar, Early India — rigorous, to 1300`, `Richard Eaton, India in the Persianate Age — rigorous, 1000–1765; Asher and Talbot, India Before Europe — Weeks 3–4`, `Kit Patrick, The History of India Podcast; Empire's Mughal episodes; Michael Wood, The Story of India (BBC)`],
  weeks: [
    { title: "The Indus, the Vedas, and the Buddha, 2600–300 BC", intro: `Cities with drains and no palaces, whose script is unread; the Vedic hymns, memorized unchanged for three thousand years; the Upanishads; the Buddha and Mahavira; and the first kingdoms of the Ganges.`, note: `India's early history has almost no dates, because Indian tradition did not write chronicles: the Vedas were transmitted orally with a precision no manuscript matched, and no one thought to record which king came when. Thapar is the guide to how historians reconstruct a chronology from texts that refuse to give one, and the week's exercise is to notice how different that is from Sima Qian's China.` },
    { title: "Mauryas, Guptas, and the South, 320 BC – AD 1200", intro: `Chandragupta and Kautilya's state, Ashoka's remorse carved on rocks across the subcontinent, the Greeks and Kushans, the Gupta golden age and its mathematics, Kalidasa, the Tamil kingdoms, and the Cholas sailing to Sumatra.`, note: `Ashoka's edicts are the first royal inscriptions in India and unlike any other king's in your courses: a ruler who conquered Kalinga, counted the dead, and had his regret published across his empire in the local languages. Compare him to Darius at Behistun and Augustus in the Res Gestae, and decide whether the remorse was policy.` },
    { title: "The sultans and the South, 1000–1526", intro: `Mahmud of Ghazni's raids, the Delhi Sultanate from the Slave kings to the Tughluqs, Ibn Battuta as a judge in Delhi, the Bhakti saints and the Sufis, Vijayanagara's capital that the Portuguese thought the largest city in the world, and Babur at Panipat.`, note: `Eaton's argument runs under the week: that the Persianate order the sultans brought was not an alien imposition but a cosmopolitan culture Indian elites adopted and adapted, the way they had adopted Sanskrit, and that Vijayanagara's Hindu kings dressed, titled, and fought like sultans. See whether the sources, especially Paes and Nuniz, bear it out.` },
    { title: "The Mughals, 1526–1707", intro: `Babur's memoirs, Humayun's exile, Akbar's experiment in a religion of his own, Jahangir's paintings, Shah Jahan's Taj, Aurangzeb's long wars, and the Sikhs and Marathas who outlasted them.`, note: `The Mughals are the best-documented dynasty in your fifteen courses: two emperors wrote their own memoirs, Akbar had his reign chronicled day by day, and European visitors described the court in detail. The quarrel is over Aurangzeb, pious restorer or bigoted destroyer, and it is a live political question in India today. Audrey Truschke's short book makes the revisionist case; read the sources before you take a side.` }

  weeks: [

    { title: "Island worlds before contact", intro: `Tonga's maritime chiefdom, Hawaiʻi's kingdoms and the ahupuaʻa, Māori Aotearoa, Rapa Nui and its statues, the Melanesian big men and the kula ring, and Aboriginal Australia's sixty thousand years.`, note: `The sources for this week were written down after contact, by missionaries, settlers, and the islanders' own first literate generation: Malo and Kamakau in Hawaiʻi, the Māori informants of Grey and Best, the Kumulipo chant. Each is a pre-contact society remembered through the catastrophe that followed; read for what the rememberers needed the past to have been.` },

    { title: "Missionaries, planters, empires, and the sea of islands, 1797–1976", intro: `The missions, the sandalwood and whaling fleets, the Musket Wars, blackbirding, Kamehameha's kingdom and its overthrow, the Treaty of Waitangi, the partitions of Samoa and New Guinea, and the revival: Hōkūleʻa, Hauʻofa, and the islanders' reply to the map that made them small.`, note: `Hauʻofa's essay Our Sea of Islands is the text to end on: a Tongan scholar's argument that the Pacific is not scattered specks in a vast ocean but a sea of islands joined by it, and that the smallness was a colonial way of seeing. After fifteen courses on empires, it is the right last reading.` }

<script>
/* The Seminar — app logic (v2) */
(function(){
"use strict";
const COURSES = (window.COURSE_DATA||[]).slice().sort((a,b)=>a.order-b.order);
const ALIASES = window.ALIASES||{_all:[]};
const LS="seminar.v1", KEY="seminar.apikey", MODELKEY="seminar.model", GHKEY="seminar.ghtoken", GISTKEY="seminar.gistid";
const COLORS=["var(--blue)","var(--red)","var(--ochre)","var(--green)","var(--plum)"];
const SHAPES=["square","circle","tri"];
const WEIGHTS={ discussion:.10, homework:.15, assignment:.25, quiz:.15, weekExam:.15, final:.20 };
const MODELS=[["claude-sonnet-5-5","Sonnet 5.5 (default)"],["claude-haiku-5-5","Haiku 5.5 (fast, cheap)"],["claude-opus-5-5","Opus 5.5"],["claude-fable-5-1","Fable 5.1"]];
const STUDENT="Laine";
const DAY=86400000;
const now=()=>Date.now();

/* ---------- state ---------- */
let S=load();
function blank(){ return {courses:{},chat:{},review:{cards:{}},capstones:{},writing:{},meta:{updatedAt:0}}; }
function load(){ try{ const j=JSON.parse(localStorage.getItem(LS)||"{}"); return Object.assign(blank(), j); }catch(e){ return blank(); } }
let saveT=null, syncT=null;
let WARNED=false;
function save(){ S.meta=S.meta||{}; S.meta.updatedAt=now(); delete S._changed; clearTimeout(saveT); saveT=setTimeout(()=>{ try{ const j=JSON.stringify(S); localStorage.setItem(LS,j); if(j.length>4000000&&!WARNED){ WARNED=true; toast("Storage is getting full: export a backup from Settings."); } }catch(e){ toast("Could not save: this browser's storage is full. Export a backup from Settings."); } },120); scheduleSync(); }
function storageSize(){ try{ return (localStorage.getItem(LS)||"").length; }catch(e){ return 0; } }
function cstate(cid){ return S.courses[cid]=S.courses[cid]||{classes:{},exams:{},sources:{}}; }
function kstate(cid,i){ const c=cstate(cid); return c.classes[i]=c.classes[i]||{mat:{},gen:{},disc:[],assign:{},hw:{},quiz:{},_t:0}; }
function stamp(o){ o._t=now(); return o; }
function getKey(){ return localStorage.getItem(KEY)||""; }
function getModel(){ return localStorage.getItem(MODELKEY)||MODELS[0][0]; }

/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function md(src){ if(!src) return ""; let lines=String(src).split(/\r?\n/),out=[],list=null,para=[];
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const flush=()=>{ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } };
  const closeList=()=>{ if(list){ out.push(list==="ul"?"</ul>":"</ol>"); list=null; } };
  for(let l of lines){ const t=l.trim(); if(!t){ flush(); closeList(); continue; } let m;
    if((m=t.match(/^(#{1,3})\s+(.*)/))){ flush(); closeList(); out.push("<h3>"+inline(m[2])+"</h3>"); continue; }
    if((m=t.match(/^[-*]\s+(.*)/))){ flush(); if(list!=="ul"){ closeList(); out.push("<ul>"); list="ul"; } out.push("<li>"+inline(m[1])+"</li>"); continue; }
    if((m=t.match(/^\d+[.)]\s+(.*)/))){ flush(); if(list!=="ol"){ closeList(); out.push("<ol>"); list="ol"; } out.push("<li>"+inline(m[1])+"</li>"); continue; }
    if((m=t.match(/^>\s?(.*)/))){ flush(); closeList(); out.push("<blockquote>"+inline(m[1])+"</blockquote>"); continue; }
    closeList(); para.push(t); }

function cleanSeg(seg){ let t=String(seg).replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim(); return t.replace(/^(light day:|finish|optional:|alternative:|if time,?|rewatch|reread|browse|skim)\s+/i,"").trim(); }
function aliasName(seg,cid){ const low=cleanSeg(seg).toLowerCase();
  for(const [re,name] of [...(ALIASES[cid]||[]),...ALIASES._all]){ if(new RegExp("^(?:the\\s+|a\\s+|an\\s+)?(?:"+re+")s?(?![a-z])","i").test(low)) return name; }
  if(/\blectures?\b|\bdebate recording\b|\bdocumentary\b/i.test(low)) return "Lectures and documentaries (YouTube)"; return null; }
function sourceName(seg,cid){ const a=aliasName(seg,cid); if(a) return a; let t=cleanSeg(seg); const low=t.toLowerCase(); if(/^(it |an? |two |if )/.test(low)) return null;
  t=t.split(/\s+(?=ch\.?\s|ch\.?\d|chapter|book\b|books\b|ep\.?\s|ep\.?\d|episodes?\b|l\d|\d|sections?\b|§|vol\b|parts?\b|whole\b|lines\b|letters?\b|tablets?\b|first half|second half|utterances|spells?\b|selections\b|skim\b|if you|on\s|at\s)/i)[0];
  t=t.split(":")[0]; t=t.split(/,\s+(?=[a-z])/)[0]; t=t.replace(/[,;]\s*$/,"").replace(/\s+(and|or|on)$/i,"").trim();
  if(/^(the|that|which)\b/i.test(t)||/^\d/.test(t)) return null; return t.length>1?t:null; }
function derivedSources(course,idx){ const k=course.classes[idx]; const out=[]; const add=n=>{ n=n.trim(); if(n&&!out.includes(n)) out.push(n); };
  [k.video,k.podcast,k.reading].forEach(f=>{ let last=null; String(f).split(/;/).forEach(seg=>{ if(!seg.trim()) return; const a=aliasName(seg,course.id); if(a){ add(a); last=a; return; } if(last) return; const n=sourceName(seg,course.id); if(n){ add(n); last=n; } }); });
  return out; }
function sources(cid){ const c=cstate(cid); return c.sources=c.sources||{}; }
/* materials as separate items: each ";"-separated piece of a class's video / podcast / reading is its own item, with its own checkbox and its own notes */
const FIELDS=[["video","Video","30 min"],["podcast","Podcast","50 min"],["reading","Reading","2 hrs"]];
function itemsOf(course,idx){ const k=course.classes[idx]; const out=[];
  FIELDS.forEach(([f,label])=>{ let last=null,n=0; String(k[f]||"").split(/;/).forEach(seg=>{ const text=seg.replace(/\s+/g," ").trim(); if(!text) return; let src=aliasName(seg,course.id); if(!src) src=last||sourceName(seg,course.id); if(!src) src=label; last=src; out.push({id:f+":"+n,field:f,n,text:text.replace(/^[,.\s]+/,"").replace(/^./,c=>c.toUpperCase()),src}); n++; }); });
  return out; }

function setItem(course,idx,it,on){ const st=kstate(course.id,idx); st.items=st.items||{}; st.items[it.id]=!!on; st.mat=st.mat||{}; st.mat[it.field]=itemsOf(course,idx).filter(x=>x.field===it.field).every(x=>itemOn(st,x)); stamp(st); save(); }
function setField(course,idx,field,on){ const st=kstate(course.id,idx); st.items=st.items||{}; itemsOf(course,idx).filter(x=>x.field===field).forEach(x=>st.items[x.id]=!!on); st.mat=st.mat||{}; st.mat[field]=!!on; stamp(st); save(); }
function fieldCount(course,idx,field){ const st=cstate(course.id).classes[idx]||{mat:{}}; const its=itemsOf(course,idx).filter(x=>x.field===field); return [its.filter(x=>itemOn(st,x)).length,its.length]; }
function classSources(course,idx){ const src=sources(course.id); const names=derivedSources(course,idx);
  Object.keys(src).forEach(n=>{ if(((src[n].entries||{})[idx]!=null||(src[n].items||{})[idx])&&!names.includes(n)) names.push(n); });
  ((cstate(course.id).classes[idx]||{}).extraSources||[]).forEach(n=>{ if(!names.includes(n)) names.push(n); }); return names; }
function srec(cid,name){ const src=sources(cid); const s=src[name]=src[name]||{entries:{},t:{}}; s.entries=s.entries||{}; s.t=s.t||{}; return s; }
function sweep(cid,name){ const src=sources(cid), s=src[name]; if(!s) return; Object.keys(s.items||{}).forEach(i=>{ if(!Object.keys(s.items[i]).length) delete s.items[i]; }); if(s.items&&!Object.keys(s.items).length) delete s.items; if(!Object.keys(s.entries).length&&!s.items&&!Object.keys(s.t).length&&!Object.keys(s.it||{}).length) delete src[name]; }

function baseSystem(){ return `You are the professor of a rigorous, self-directed, graduate-style seminar in history. The student is ${STUDENT}: an adult learner with a strong academic background (economics BA, published research, a working high-school engineering teacher) who reads primary sources closely and is considering a master's in history. Treat her as a capable graduate student: be warm but demanding, specific rather than general, and always push toward evidence, argument, and the sources. Never flatter. Never invent quotations or page numbers; when you are unsure of a detail, say so. Refer to the assigned sources by name. Address her as Laine when it is natural.`; }
function professorSystem(course,idx){ const k=idx!=null?course.classes[idx]:null; const w=idx!=null?course.weeks[Math.min(3,Math.floor(idx/7))]:null;

function str(x){ return x==null?"":(typeof x==="string"?x:(typeof x==="object"?(x.text||x.prompt||x.question||x.q||JSON.stringify(x)):String(x))); }

async function ensureGen(course,idx,what){ const st=kstate(course.id,idx); if(st.gen[what]) return st.gen[what]; const sys=professorSystem(course,idx); let user,max=1800;

  else if(what==="discussion"){ user=`Write three discussion questions for this class. Each should be open, argumentative, and anchored in the assigned sources (name them), the kind a good seminar leader would open with; at least one should set two sources against each other, and one should connect to the week's method note. No yes/no questions. Return JSON only, with every line break inside a string written as \\n: {"questions":["...","...","..."]}`; max=1400; }
  else if(what==="assignment"){ user=`Set the written assignment for this class: a 300–500 word response that requires an argument supported by specific evidence from the assigned reading. Give the prompt, a three-point rubric, and the target length. Return JSON only, with every line break inside a string written as \\n: {"prompt":"...","rubric":["...","...","..."],"length":"300–500 words"}`; max=1400; }
  else if(what==="homework"){ user=`Set the homework for this class: a close-reading or source-analysis task on one specific assigned primary source (or, if none is assigned, on one passage of the secondary reading). Ask her to identify the author's purpose, audience, what the text claims, what it leaves out, and one thing a historian can and cannot conclude from it. Keep it to a task she can finish in 20–30 minutes of writing. Return JSON only, with every line break inside a string written as \\n: {"source":"the source named","prompt":"..."}`; max=1200; }
  else if(what==="quiz"){ user=`Write a five-question multiple-choice quiz on this class's assigned materials. Mix factual recall (names, dates, events) with interpretation (what a source argues, why an event mattered). Four options each, one correct, plausible distractors, and a one-sentence explanation for each answer. Return JSON only: {"questions":[{"q":"...","options":["...","...","...","..."],"answer":0,"explanation":"..."}]}`; max=2600; }
  else if(what==="flashcards"){ user=`Write eight review cards for this class: the names, dates, terms, and arguments she must retain. Front is a short prompt (a name, a term, a date, or a "what did X argue" question); back is a crisp answer of one or two sentences with the source named where relevant. Return JSON only: {"cards":[{"front":"...","back":"..."}]}`; max=1800; }
  let out=await claude(sys,[{role:"user",content:user}],{json:what!=="lecture",max}); if(what!=="lecture") out=normalize(what,out); else if(!String(out).trim()) throw new Error("SHAPE"); st.gen[what]=out; stamp(st); save(); return out; }
async function ensureExam(course,which){ const c=cstate(course.id); c.exams[which]=c.exams[which]||{}; if(c.exams[which].paper) return c.exams[which].paper; const sys=professorSystem(course,null); let scope,n,nshort,max;

    const body={description:"The Seminar — study state (private)",public:false,files:{"the-seminar-state.json":{content:JSON.stringify(S)}}}; const id=localStorage.getItem(GISTKEY); if(id){ await gh("PATCH","/gists/"+id,{files:body.files}); } else { const g=await gh("POST","/gists",body); localStorage.setItem(GISTKEY,g.id); }
    setSync("ok","Synced "+new Date().toLocaleTimeString()); if(changed){ const tag=(document.activeElement&&document.activeElement.tagName||"").toLowerCase(); if(tag==="textarea"||tag==="input") RERENDER=true; else route(); } } catch(e){ setSync("err",errMsg(e)); } finally{ SYNCING=false; } }
function scheduleSync(){ if(!ghToken()) return; clearTimeout(syncT); syncT=setTimeout(syncNow,6000); }

/* ---------- views ---------- */
function route(){ RERENDER=false; const h=ROUTE.replace(/^\/?/,""); const p=h.split("/").filter(Boolean); closeDrawer(); CUR=null; if(!/\/notebook/.test(h)) document.body.classList.remove("focus"); try{ routeInner(h,p); }catch(e){ console.error(e); $("#app").innerHTML=`<div class="lead"><h1>Something went wrong</h1><p class="err">${esc(e.message||e)}</p><p><a class="btn ghost small" href="#/">Home</a></p></div>`; } growAll(); }
function routeInner(h,p){
  if(p[0]==="c"&&p[1]){ const course=COURSES.find(c=>c.id===p[1]); if(!course) return renderHome(); document.documentElement.style.setProperty("--accent",colorFor(course));
    if(p[2]==="exam"&&p[3]) return renderExam(course,p[3]); if(p[2]==="notebook") return renderNotebook(course,p[3]?decodeURIComponent(p[3]):null); if(p[2]==="portfolio") return renderPortfolio(course);
    if(p[2]!=null&&/^\d+$/.test(p[2])){ const i=parseInt(p[2])-1; if(i>=0&&i<25) return renderClass(course,i); } return renderCourse(course); }
  document.documentElement.style.setProperty("--accent","var(--blue)");
  if(p[0]==="grades") return renderGrades(); if(p[0]==="settings") return renderSettings(); if(p[0]==="timeline") return renderTimeline(); if(p[0]==="capstones") return renderCapstones(p[1]||null); if(p[0]==="review") return renderReview(); if(p[0]==="writing") return renderWriting(); if(p[0]==="search") return renderSearch(decodeURIComponent(p.slice(1).join("/")||""));
  renderHome(); }
document.addEventListener("focusout",()=>{ if(RERENDER){ RERENDER=false; setTimeout(()=>{ const tag=(document.activeElement&&document.activeElement.tagName||"").toLowerCase(); if(tag!=="textarea"&&tag!=="input") route(); else RERENDER=true; },200); } });
function bar(crumb,course){ const shape=course?shapeFor(course):"square"; const due=dueCards().length; const r=ROUTE.replace(/^\/?/,"");
  const on=p=>(p==="/"?r==="":r.startsWith(p.slice(1)))?"on":"";
  $("#bnav").innerHTML=`<button data-r="/" class="${r===""?"on":""}"><em></em>Home</button>${course?`<button data-r="/c/${course.id}" class="on"><em></em>Course</button>`:""}<button data-r="/review" class="${on("/review")}"><em></em>Review${due?` <i class="pill">${due}</i>`:""}</button><button data-r="/grades" class="${on("/grades")}"><em></em>Grades</button><button data-r="/settings" class="${on("/settings")}"><em></em>Settings</button>`;
  $("#bar").innerHTML=`<a href="#/" class="mark ${shape}" title="Home"></a><div class="crumb">${crumb}</div><button data-r="/">Home</button>${course?`<button data-r="/c/${course.id}">Course</button>`:""}<button data-r="/review">Review${due?` <i class="pill">${due}</i>`:""}</button><button data-r="/grades">Grades</button><button data-r="/settings">Settings <span id="syncdot" class="syncdot ${SYNCSTATE.status}" title="${esc(SYNCSTATE.msg||SYNCSTATE.status)}"></span></button>`; }

function renderHome(){ bar(`<b>The Seminar</b> · a reading course in world history`); const key=getKey();
  const n=COURSES.length; const num=["Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty"][n-11]||n;
  const act=COURSES.map(c=>({c,t:lastActivity(c.id),next:nextClass(c.id)})).filter(x=>x.t&&x.next!=null).sort((a,b)=>b.t-a.t)[0];
  const due=dueCards().length;
  let cont=""; if(act){ const k=act.c.classes[act.next]; const pl=plan(act.c.id); cont=`<a class="cont" href="#/c/${act.c.id}/${act.next+1}" style="--c:${colorFor(act.c)}"><div class="k">Continue · ${esc(act.c.title)} · Class ${act.next+1}</div><h3>${esc(k.title)}</h3><div class="sub">${pl&&pl.remaining>0?`${pl.remaining} classes left · about ${pl.perWeek} a week to finish by ${pl.target}`:`${25-courseProgress(act.c.id)} classes left in this course`}${due?` · ${due} review card${due>1?"s":""} due`:""}</div></a>`; }
  else if(key) cont=`<div class="cont" style="--c:var(--blue)"><div class="k">Begin</div><h3>Open a course and start with Class 1</h3><div class="sub">The first course in the sequence is Rome.</div></div>`;
  $("#app").innerHTML=`<div class="hero"><h1>The Seminar</h1><p>${num} courses, twenty-five classes each. Every class has its video, podcast, and reading; notes by source; a discussion with the professor; a written assignment; homework on a source; and a quiz. Each week ends in an exam, each course in a final, and the sequence in capstone essays. There are no dates. A class is done when you have done it.</p>${key?"":`<p style="margin-top:10px"><a class="btn primary" href="#/settings">Connect Claude to begin</a></p>`}</div>
  ${cont}
  <div class="row" style="margin:16px 0 4px;gap:8px"><a class="btn ghost small" href="#/timeline">Timeline</a><a class="btn ghost small" href="#/capstones">Capstones</a><a class="btn ghost small" href="#/writing">Writing</a><a class="btn ghost small" href="#/search">Search notes</a></div>
  <div class="courses">${COURSES.map(c=>{ const done=courseProgress(c.id); const g=courseGrade(c.id).overall; return `<a class="course" href="#/c/${c.id}" style="--c:${colorFor(c)}"><div class="shape ${shapeFor(c)}"></div><div class="n">COURSE ${String(c.order).padStart(2,"0")}</div><h3>${esc(c.title)}</h3><div class="sub">${esc(c.subtitle)}</div><div class="prog"><div class="pbar"><i style="width:${done*4}%"></i></div><span>${done}/25${g!=null?` · ${letter(g)}`:""}</span></div></a>`; }).join("")}</div>`; }

function renderCourse(course){ bar(`Course ${String(course.order).padStart(2,"0")} · <b>${esc(course.title)}</b>`,course); const c=cstate(course.id); const g=courseGrade(course.id); const pl=plan(course.id); const nx=nextClass(course.id);
  let html=`<div class="lead"><h1>${esc(course.title)}</h1><div class="sub">${esc(course.subtitle)}${g.overall!=null?` · current grade ${letter(g.overall)} (${Math.round(g.overall)})`:""}</div><p>${esc(course.lead)}</p><div class="spine">${course.spine.map(s=>`<div>${esc(s)}</div>`).join("")}</div>
  <div class="row" style="margin-top:14px;gap:8px">${nx!=null?`<a class="btn primary small" href="#/c/${course.id}/${nx+1}">Continue · Class ${nx+1}</a>`:""}<a class="btn ghost small" href="#/c/${course.id}/notebook">Notebook</a><a class="btn ghost small" href="#/c/${course.id}/portfolio">Portfolio</a></div>
  <div class="planner"><div><span class="lbl">Finish by</span> <input type="date" id="target" value="${esc((c.plan||{}).target||"")}"> ${pl?`<span class="hint">${pl.remaining>0?(pl.daysLeft>0?`${pl.remaining} classes left in ${pl.daysLeft} days: about ${pl.perWeek} a week.`:`${pl.remaining} classes left; the date has passed, so pick a new one when you like.`):"Course complete."} Nothing here is ever overdue.</span>`:`<span class="hint">Optional. The app spaces the remaining classes and quietly recomputes when you miss a day.</span>`}</div></div></div>`;
  for(let w=0;w<4;w++){ const from=w*7,to=Math.min(24,from+6);
    html+=`<section class="week"><h2>Week ${w+1}<span>${esc(course.weeks[w].title)}</span></h2><div class="wintro">${esc(course.weeks[w].intro)}</div>`;
    for(let i=from;i<=to;i++){ const k=course.classes[i]; const st=c.classes[i]||{mat:{}}; const qc=FIELDS.map(([f,l])=>{ const [d,n]=fieldCount(course,i,f); return `<b class="qc ${d===n?"on":(d?"part":"")}" data-qc="${f}" data-i="${i}" title="${d} of ${n} done">${l}${n>1?` ${d}/${n}`:""}</b>`; }).join("");
      html+=`<a class="cls" href="#/c/${course.id}/${i+1}"><div class="num">${String(i+1).padStart(2,"0")}</div><div class="t"><h4>${esc(k.title)}</h4><div class="meta">${qc}${typeof st.quiz?.score==="number"?`<b class="on">Quiz ${Math.round(st.quiz.score)}</b>`:""}${typeof st.assign?.score==="number"?`<b class="on">Essay ${st.assign.letter||Math.round(st.assign.score)}</b>`:""}</div></div><div class="done ${classDone(course.id,i)?"y":""}"></div></a>`; }
    const ex=c.exams["w"+(w+1)]; const es=examScore(ex);
    html+=`<a class="exam-row" href="#/c/${course.id}/exam/w${w+1}"><span class="lbl">Week ${w+1} exam</span><span class="score">${es!=null?`${Math.round(es)} · ${letter(es)}`:(ex&&ex.paper?"in progress":"not taken")}</span></a></section>`; }
  const fs=examScore(c.exams.final);
  html+=`<section class="week"><h2>Final<span>Course examination</span></h2><a class="exam-row" href="#/c/${course.id}/exam/final"><span class="lbl">Final exam</span><span class="score">${fs!=null?`${Math.round(fs)} · ${letter(fs)}`:(c.exams.final&&c.exams.final.paper?"in progress":"not taken")}</span></a></section>`;
  $("#app").innerHTML=html;
  $("#target").onchange=e=>{ c.plan={target:e.target.value,_t:now()}; save(); renderCourse(course); };
  $$(".qc").forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); const i=+b.dataset.i; const [d,n]=fieldCount(course,i,b.dataset.qc); setField(course,i,b.dataset.qc,d<n); renderCourse(course); }); }

let CUR=null, TAB="materials"; const OPEN_NOTES=new Set();
function renderClass(course,i){ CUR={course,idx:i}; const k=course.classes[i]; const st=kstate(course.id,i); bar(`${esc(course.title)} · <b>Class ${i+1}</b>`,course);
  const tabs=[["materials","Materials"],["lecture","Briefing"],["notes","Notes"],["discussion","Discussion"],["assignment","Assignment"],["homework","Homework"],["quiz","Quiz"],["review","Cards"]];
  const dot=t=>(t==="notes"&&hasNotes(course.id,i))||(t==="discussion"&&st.disc.some(d=>d.thread&&d.thread.length))||(t==="assignment"&&typeof st.assign.score==="number")||(t==="homework"&&typeof st.hw.score==="number")||(t==="quiz"&&typeof st.quiz.score==="number")||(t==="materials"&&st.mat.video&&st.mat.podcast&&st.mat.reading)||(t==="lecture"&&st.gen.lecture)||(t==="review"&&st.gen.flashcards);
  $("#app").innerHTML=`<div class="chead"><div class="k">Week ${Math.min(4,Math.floor(i/7)+1)} · Class ${i+1} of 25 · about 3 h 20 min</div><h1>${esc(k.title)}</h1><div class="nav">${i>0?`<a href="#/c/${course.id}/${i}">← Previous</a>`:""}<a href="#/c/${course.id}">Course</a><a href="#/c/${course.id}/notebook">Notebook</a>${i<24?`<a href="#/c/${course.id}/${i+2}">Next →</a>`:""}</div></div>
  <div class="class-grid"><div class="tabs">${tabs.map(([id,l],n)=>`<button data-t="${id}" class="${TAB===id?"on":""}" title="Press ${n+1}">${l}${dot(id)?'<span class="dot"></span>':""}</button>`).join("")}</div><div id="panel" class="panel"></div></div>`;
  $$(".tabs button").forEach(b=>b.onclick=()=>{ TAB=b.dataset.t; renderClass(course,i); }); renderTab(); growAll(); }
async function withStatus(btn,fn){ const s=btn.parentElement.querySelector(".status")||btn.parentElement.parentElement.querySelector(".status"); try{ btn.disabled=true; if(s) s.innerHTML='<span class="spin"></span> Asking the professor…'; await fn(); } catch(e){ if(s) s.innerHTML=`<span class="err">${esc(errMsg(e))}</span>`; btn.disabled=false; throw e; } }
function renderTab(){ const {course,idx:i}=CUR; const k=course.classes[i]; const st=kstate(course.id,i); const p=$("#panel"); const w=course.weeks[Math.min(3,Math.floor(i/7))];
  if(TAB==="materials"){ const names=classSources(course,i); const its=itemsOf(course,i); const total=its.length, done=its.filter(x=>itemOn(st,x)).length;
    const item=it=>{ const on=itemOn(st,it); const note=getItemNote(course.id,it.src,i,it.id); const open=!!note.trim()||OPEN_NOTES.has(course.id+":"+i+":"+it.id);
      return `<li class="mi ${on?"y":""}" data-id="${it.id}"><div class="mirow"><button class="box ${on?"y":""}" data-chk="${it.id}" role="checkbox" aria-checked="${on}" aria-label="Done"></button><div class="mix"><div class="mit">${esc(it.text)}</div><div class="mim"><span class="misrc">${esc(it.src)}</span><button class="minb" data-nb="${it.id}">${note.trim()?`Notes · ${words(note)} words`:"Add notes"}</button></div></div></div>
      <div class="minotes" ${open?"":"hidden"}><textarea class="ta small auto" data-inote="${it.id}" data-src="${esc(it.src)}" placeholder="Notes on this ${it.field==="reading"?"reading":it.field}. They collect under ${esc(it.src)} in the notebook.">${esc(note)}</textarea><div class="row" style="margin-top:6px"><button class="btn ghost small" data-mic="${it.id}">Dictate</button><span class="status" data-st="${it.id}"></span></div></div></li>`; };
    p.innerHTML=`<div class="sec"><div class="sh2"><h3>Required for this class</h3><span class="hint">${done} of ${total} done</span></div>${FIELDS.map(([f,l,t])=>{ const list=its.filter(x=>x.field===f); if(!list.length) return ""; const [d,n]=fieldCount(course,i,f); return `<div class="mgrp"><div class="mghead"><span class="l">${l}</span><span class="hint">${t}${n>1?` · ${d}/${n}`:""}</span>${n>1?`<button class="minb" data-all="${f}">${d===n?"Clear all":"Mark all done"}</button>`:""}</div><ul class="mlist">${list.map(item).join("")}</ul></div>`; }).join("")}</div>
    <div class="sec"><h3>Where to find them</h3><div class="links">${names.map(n=>{ const L=linkFor(n,course); return `<a class="lk" href="${esc(L.url)}" target="_blank" rel="noopener"><span>${esc(n)}</span><em>${esc(L.label)} ↗</em></a>`; }).join("")}</div><div class="hint" style="margin-top:6px">Direct links where a free text exists; otherwise the right place to look. Books go to a library catalog.</div></div>
    <div class="sec"><h3>This week</h3><div class="note"><b>${esc(w.title)}.</b> ${esc(w.intro)}</div></div><div class="sec"><h3>Method note</h3><div class="prose" style="color:var(--ink-2);font-size:14px">${esc(w.note)}</div></div>`;
    $$("[data-chk]",p).forEach(b=>b.onclick=()=>{ const it=its.find(x=>x.id===b.dataset.chk); setItem(course,i,it,!itemOn(st,it)); renderClass(course,i); });
    $$("[data-all]",p).forEach(b=>b.onclick=()=>{ const [d,n]=fieldCount(course,i,b.dataset.all); setField(course,i,b.dataset.all,d<n); renderClass(course,i); });
    $$("[data-nb]",p).forEach(b=>b.onclick=()=>{ const key=course.id+":"+i+":"+b.dataset.nb; const box=b.closest(".mi").querySelector(".minotes"); if(box.hidden){ box.hidden=false; OPEN_NOTES.add(key); growAll(box); box.querySelector("textarea").focus(); } else { box.hidden=true; OPEN_NOTES.delete(key); } });
    $$("textarea[data-inote]",p).forEach(ta=>{ const it=its.find(x=>x.id===ta.dataset.inote); const stt=p.querySelector(`[data-st="${it.id}"]`); const put=()=>{ setItemNote(course.id,it.src,i,it.id,ta.value); if(stt) stt.textContent="Saved"; const b=p.querySelector(`[data-nb="${it.id}"]`); if(b) b.textContent=ta.value.trim()?`Notes · ${words(ta.value)} words`:"Add notes"; }; ta.oninput=put; const mic=p.querySelector(`[data-mic="${it.id}"]`); if(mic) setupMic(mic,ta,put); }); }
  else if(TAB==="lecture"){ if(st.gen.lecture) p.innerHTML=`<div class="sec"><h3>Professor's briefing</h3><div class="prose">${md(st.gen.lecture)}</div></div><div class="row"><button class="btn ghost small" id="regen">Regenerate</button></div>`;
    else p.innerHTML=`<div class="sec"><h3>Professor's briefing</h3><p class="empty">A short briefing to read before you start the materials: what the class is about, what to watch for, and a question to carry into the reading.</p><button class="btn primary" id="gen">Ask for the briefing</button><div id="s" class="status"></div></div>`;
    const b=$("#gen",p)||$("#regen",p); if(b) b.onclick=async()=>{ if(b.id==="regen") delete st.gen.lecture; try{ await withStatus(b,()=>ensureGen(course,i,"lecture")); renderClass(course,i); }catch(e){} }; }
  else if(TAB==="notes"){ const names=classSources(course,i);
    p.innerHTML=`<div class="sec"><h3>Notes, by source</h3><p class="empty" style="padding:0 0 10px">One section per source for this class. Everything you write on a source, across every class, collects in the <a href="#/c/${course.id}/notebook" style="text-decoration:underline">course notebook</a>.</p>
    ${names.map((n,ni)=>{ const txt=getNote(course.id,n,i); const rec=sources(course.id)[n]; const total=rec?noteIdxs(rec).length:0; const its=itemsOf(course,i).filter(x=>x.src===n);
      return `<div class="src" data-n="${esc(n)}"><div class="sh"><button class="nm" title="Rename" data-ren="${ni}">${esc(n)}</button><span class="cnt">${total?`${total} class${total>1?"es":""} · <a href="#/c/${course.id}/notebook/${encodeURIComponent(n)}">all notes</a>`:""}</span></div>
      ${its.map(it=>`<div class="srci"><div class="srcl">${esc(it.text)}</div><textarea class="ta small auto" data-inote="${it.id}" data-src="${esc(n)}" placeholder="Notes on this ${it.field}.">${esc(getItemNote(course.id,n,i,it.id))}</textarea></div>`).join("")}
      ${its.length?`<div class="srcl">On ${esc(n)} generally, this class</div>`:""}<textarea class="ta small auto" data-src="${esc(n)}" placeholder="Notes on ${esc(n)}. Markdown works: **bold**, - lists, > quotes.">${esc(txt)}</textarea><div class="row" style="margin-top:6px"><button class="btn ghost small" data-mic="${ni}">Dictate</button></div></div>`; }).join("")}
    <div class="row" style="margin-top:14px"><button class="btn ghost small" id="addsrc">Add a source</button><span class="status" id="ns"></span></div></div>`;
    $$("textarea[data-src]:not([data-inote])",p).forEach(ta=>{ ta.oninput=()=>{ setNote(course.id,ta.dataset.src,i,ta.value); $("#ns",p).textContent="Saved"; }; });
    $$("textarea[data-inote]",p).forEach(ta=>{ ta.oninput=()=>{ setItemNote(course.id,ta.dataset.src,i,ta.dataset.inote,ta.value); $("#ns",p).textContent="Saved"; }; });
    $$("button[data-mic]",p).forEach(b=>{ const ta=b.closest(".src").querySelector("textarea[data-src]:not([data-inote])"); setupMic(b,ta,()=>setNote(course.id,ta.dataset.src,i,ta.value)); });
    $$("button[data-ren]",p).forEach(b=>b.onclick=()=>{ const from=b.closest(".src").dataset.n; const to=prompt("Rename this source (notes under both names merge):",from); if(to&&to.trim()&&to.trim()!==from){ st.extraSources=(st.extraSources||[]).filter(n=>n!==from); if(!derivedSources(course,i).includes(to.trim())) st.extraSources.push(to.trim()); stamp(st); renameSource(course.id,from,to.trim()); renderClass(course,i); } });
    $("#addsrc",p).onclick=()=>{ const n=prompt("Source name (e.g. SPQR, Livy, History of Rome):"); if(n&&n.trim()){ st.extraSources=st.extraSources||[]; if(!classSources(course,i).includes(n.trim())) st.extraSources.push(n.trim()); stamp(st); save(); renderClass(course,i); } }; }
  else if(TAB==="discussion"){ if(st.gen.discussion&&!validGen("discussion",st.gen.discussion)) delete st.gen.discussion; const qs=st.gen.discussion&&st.gen.discussion.questions;
    if(!qs){ p.innerHTML=`<div class="sec"><h3>Discussion</h3><p class="empty">Three seminar questions from the professor. Answer in writing; the professor replies, pushes back, and you can keep the thread going.</p><button class="btn primary" id="gen">Open the discussion</button><div class="status" id="s"></div></div>`; $("#gen",p).onclick=async()=>{ try{ await withStatus($("#gen",p),()=>ensureGen(course,i,"discussion")); renderClass(course,i); }catch(e){} }; return; }
    p.innerHTML=`<div class="sec"><h3>Discussion</h3>${qs.map((q,qi)=>{ const d=st.disc[qi]=st.disc[qi]||{thread:[]}; return `<div class="q"><div class="qt">${qi+1}. ${esc(q)}</div><div class="thread">${d.thread.map(m=>`<div class="msg ${m.role==="user"?"me":"prof"}"><div class="who">${m.role==="user"?STUDENT:"Professor"}</div><div class="prose">${md(m.content)}</div></div>`).join("")}</div><textarea class="ta small" id="d${qi}" placeholder="${d.thread.length?"Reply":"Your answer"}"></textarea><div class="row" style="margin-top:8px"><button class="btn small" data-q="${qi}">Send to the professor</button><span class="status" id="ds${qi}"></span></div></div>`; }).join("")}</div>`;
    $$("button[data-q]",p).forEach(b=>b.onclick=async()=>{ const qi=+b.dataset.q; const ta=$("#d"+qi,p); const txt=ta.value.trim(); if(!txt) return; const d=st.disc[qi]; d.thread.push({role:"user",content:txt}); stamp(st); save();
      try{ b.disabled=true; $("#ds"+qi,p).innerHTML='<span class="spin"></span>'; const sys=professorSystem(course,i)+`\n\nYou are leading a written seminar discussion. The discussion question is: "${qs[qi]}". Respond to the student's latest contribution in 120–220 words: engage her specific claims, push back where the evidence is thin or the reading of a source is loose, add one thing from the assigned sources she has not used, and end with one sharper follow-up question. No preamble, no praise for its own sake.`;
        const reply=await claude(sys,d.thread.map(m=>({role:m.role,content:m.content})),{max:700}); d.thread.push({role:"assistant",content:reply}); stamp(st); save(); renderClass(course,i); }
      catch(e){ d.thread.pop(); save(); b.disabled=false; $("#ds"+qi,p).innerHTML=`<span class="err">${esc(errMsg(e))}</span>`; } }); }
  else if(TAB==="assignment"||TAB==="homework"){ const isA=TAB==="assignment"; if(st.gen[TAB]&&!validGen(TAB,st.gen[TAB])) delete st.gen[TAB]; const gen=isA?st.gen.assignment:st.gen.homework; const rec=isA?st.assign:st.hw; const what=isA?"assignment":"homework";

function renderTimeline(){ bar(`<b>Timeline</b>`); const MIN=-3300,MAX=2000,W=1000,ROW=34,L=170; const x=y=>L+(y-MIN)/(MAX-MIN)*(W-L-20); const H=COURSES.length*ROW+60;

  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:inherit">`;
  ticks.forEach(t=>{ svg+=`<line x1="${x(t)}" y1="20" x2="${x(t)}" y2="${H-30}" stroke="var(--rule)" stroke-width="1"/><text x="${x(t)}" y="14" font-size="11" fill="var(--ink-3)" text-anchor="middle">${fmtY(t)}</text>`; });

    sp.forEach((s,wi)=>{ if(wi===3&&s[0]===sp[0][0]) return; const from=wi*7,to=Math.min(24,from+6); let done=0; for(let i=from;i<=to;i++) if(classDone(c.id,i)) done++; const op=done?0.35+0.65*done/(to-from+1):0.22; svg+=`<a href="#/c/${c.id}/${from+1}"><rect x="${x(s[0])}" y="${y+4}" width="${Math.max(3,x(s[1])-x(s[0]))}" height="18" fill="${col}" opacity="${op}"><title>${esc(c.title)} · Week ${wi+1}: ${esc(c.weeks[wi].title)} · ${done}/${to-from+1} classes done</title></rect></a>`; }); });

  <div class="sec" style="margin-top:20px"><h3>Who was alive when</h3><div class="prose"><p>Confucius (551–479 BC) and the Buddha (c. 480–400 BC) are contemporaries of Cyrus's grandson and of Cleisthenes' Athens. The Qin unification (221 BC) falls in the year Hannibal was planning his war; the Han fall (220) as the Roman crisis begins. Muhammad's Hijra (622) is the year Heraclius marched against Khosrow II. Charlemagne, Harun al-Rashid, and the Tang's Xuanzong share the decades around 800. Mansa Musa's pilgrimage (1324) and Ibn Battuta's travels (1325–54) overlap the Black Death and the Palaiologan civil wars. Babur takes Delhi (1526) the year Suleiman wins Mohács; Akbar, Elizabeth I, and Hideyoshi rule at once. Cook dies at Kealakekua Bay (1779) the year the East India Company is swallowing Bengal and the American war is in its fourth year.</p></div></div></div>`; }

  if(needle){ COURSES.forEach(c=>{ const cs=cstate(c.id); Object.keys(cs.sources||{}).forEach(n=>noteIdxs(cs.sources[n]).forEach(i=>{ const t=sourceClassText(c.id,n,i,c); if(t.toLowerCase().includes(needle)) hits.push({c,i,kind:"note · "+n,text:t}); }));

  const snip=t=>{ const j=t.toLowerCase().indexOf(needle); const a=Math.max(0,j-80),b=Math.min(t.length,j+needle.length+120); return (a>0?"…":"")+esc(t.slice(a,j))+"<mark>"+esc(t.slice(j,j+needle.length))+"</mark>"+esc(t.slice(j+needle.length,b))+(b<t.length?"…":""); };

function setupMic(btn,ta,onchange){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ btn.style.display="none"; return; } let rec=null;
  btn.onclick=()=>{ if(rec){ rec.stop(); return; } rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang="en-US"; let base=ta.value; let finalT="";
    rec.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) finalT+=t+" "; else interim+=t; } ta.value=base+(base&&!base.endsWith("\n")&&!base.endsWith(" ")?" ":"")+finalT+interim; onchange(); };
    rec.onend=()=>{ rec=null; btn.textContent="Dictate"; onchange(); }; rec.onerror=()=>{ rec=null; btn.textContent="Dictate"; }; rec.start(); btn.textContent="Stop"; }; }

  $("#close",d).onclick=closeDrawer; $("#clear",d).onclick=()=>{ S.chat[key]=[]; save(); renderDrawer(); }; $$(".modes button",d).forEach(b=>b.onclick=()=>{ MODE=b.dataset.m; renderDrawer(); }); const dm=$("#dm",d); dm.scrollTop=dm.scrollHeight;
  const send=async()=>{ const ta=$("#din",d); const t=ta.value.trim(); if(!t) return; thread.push({role:"user",content:t}); save(); ta.value=""; renderDrawer(); const dm2=$("#dm",d); dm2.insertAdjacentHTML("beforeend",'<div class="msg prof"><span class="spin"></span></div>'); dm2.scrollTop=dm2.scrollHeight;
    try{ const sys=(CUR?professorSystem(CUR.course,CUR.idx):baseSystem()+`\n\nThe courses in the sequence: ${COURSES.map(c=>c.title+" ("+c.subtitle+")").join("; ")}. The student may ask about any of them.`)+`\n\nThis is office hours, in writing. Mode: ${MODES[MODE]}`; const reply=await claude(sys,thread.slice(-16).map(m=>({role:m.role,content:m.content})),{max:1000}); thread.push({role:"assistant",content:reply}); save(); renderDrawer(); }
    catch(e){ thread.pop(); save(); renderDrawer(); $("#dm",d).insertAdjacentHTML("beforeend",`<div class="err">${esc(errMsg(e))}</div>`); } };
  $("#send",d).onclick=send; $("#din",d).onkeydown=e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) send(); }; }
$("#fab").onclick=openDrawer; $("#scrim").onclick=closeDrawer;

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{ const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select"||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="/"){ e.preventDefault(); nav("/search"); return; } if(e.key==="p"||e.key==="P"){ openDrawer(); return; } if(e.key==="Escape"){ closeDrawer(); document.body.classList.remove("focus"); return; }
  if(!CUR) return; const tabs=["materials","lecture","notes","discussion","assignment","homework","quiz","review"];
  if(e.key==="ArrowLeft"&&CUR.idx>0) nav(`/c/${CUR.course.id}/${CUR.idx}`); else if(e.key==="ArrowRight"&&CUR.idx<24) nav(`/c/${CUR.course.id}/${CUR.idx+2}`); else if(/^[1-8]$/.test(e.key)){ TAB=tabs[+e.key-1]; renderClass(CUR.course,CUR.idx); } });

/* ---------- boot ---------- */
migrate(); route(); if(ghToken()) syncNow();
window.SEMINAR={state:()=>S,courses:COURSES,nav,merge:mergeStates,sync:syncNow,cards,dueCards};
})();

</script>
