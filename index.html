:root{
  --paper:#F3F0E8; --paper-2:#EAE6DB; --ink:#1C1B18; --ink-2:#55524A; --ink-3:#8C887D; --rule:#CFCABD;
  --red:#A63D2F; --blue:#3C5A7A; --ochre:#B8892B; --green:#4E6B4A; --plum:#6B4A5E;
  --accent:var(--blue);
  --font:"Jost","Futura","Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-weight:500;line-height:1.15;letter-spacing:-.01em}
.sr{position:absolute;left:-9999px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:52px}
.bar .mark{width:14px;height:14px;background:var(--accent);flex:none}
.bar .mark.circle{border-radius:50%}
.bar .mark.tri{width:0;height:0;background:none;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid var(--accent)}
.bar .crumb{flex:1;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .crumb b{color:var(--ink);font-weight:500}
.bar button{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:6px 0}
.bar button:hover{color:var(--ink)}

.wrap{max-width:860px;margin:0 auto;padding:22px 18px 80px}

/* home */
.homehero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;padding:30px 0 26px;border-bottom:1px solid var(--ink);align-items:start}
.homehero .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.homehero h1{font-size:clamp(44px,6vw,84px);font-weight:500;letter-spacing:-.025em;line-height:.95;margin:8px 0 18px}
.mission{font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--ink);max-width:56ch} .mission .minb{font-family:var(--font);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:8px;border-bottom-color:var(--rule)}
.line{margin:0;padding:26px 28px;background:#fff;border:1px solid var(--rule);border-left:6px solid var(--c);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.line blockquote{font-family:var(--serif);font-size:clamp(20px,2vw,27px);line-height:1.4;letter-spacing:-.01em;font-style:italic;margin:0}
.line figcaption{margin-top:16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)} .line figcaption b{font-weight:500;color:var(--ink-2)} .line figcaption a{text-decoration:underline}
.cvstat.home4{grid-template-columns:repeat(4,1fr);border-top:0;margin:0 0 18px} .cvstat.home4 .cvs .v.big{font-size:34px} .cvstat.home4 .cvs .v.big small{display:block;margin-top:2px}
@media (max-width:1099px){ .cvstat.home4{grid-template-columns:repeat(2,1fr)} .cvstat.home4 .cvs:nth-child(2){border-right:0} .cvstat.home4 .cvs:nth-child(-n+2){border-bottom:1px solid var(--rule)} }

  weeks: [
    { title: "Revelation and conquest, 610–750", intro: `A merchant in Mecca receives a revelation; within thirty years of his death his followers rule from Tunisia to the Oxus. The sources were written a century and a half later: what can we actually know about the first decades?`, note: `The week's method question is the hadith. Hundreds of thousands of sayings attributed to the Prophet, transmitted orally and written down two centuries on, with elaborate chains of authority to vouch for them. Muslim scholars built a science of sifting them that Western historians mostly rejected and have partly come back to. Look at one chain on Sunnah.com, and think about Beard's consular lists.` },

  lead: `The civilization every other course fought and never studied: Cyrus to the Sasanians. Also the month with the worst source problem, since most of what survives was written by enemies, subjects, or heirs.`,
  spine: [`Lloyd Llewellyn-Jones, Persians: The Age of the Great Kings — Week 1`, `Adrian Goldsworthy, Rome and Persia — Weeks 2–3; Touraj Daryaee, Sasanian Persia — Week 3`, `Michael Axworthy, Iran: Empire of the Mind — the through-line; Josef Wiesehöfer, Ancient Persia — reference`, `Trevor Culley, The History of Persia podcast; The Ancients`],
  weeks: [
    { title: "The Achaemenids, 550–330 BC", intro: `In one lifetime a Persian chieftain's grandson rules the largest empire the world had seen; his successors hold it for two centuries with a system the Romans would later copy.`, note: `The week's exercise is Herodotus 3.80–82 against Behistun. Herodotus has seven Persian conspirators hold a philosophy seminar on monarchy, oligarchy, and democracy before choosing a king; Darius's own inscription has the Lie, the god Ahuramazda, and nineteen battles. Decide what each author needed the story to do.` },
    { title: "The long interruption, 330 BC – AD 224", intro: `Alexander burns Persepolis; the Seleucids rule for a century and a half; then a nomad dynasty takes Iran, holds it for four hundred years, beats Rome at Carrhae, and leaves almost no writing behind.`, note: `The Parthians ruled Iran for longer than the Achaemenids and Sasanians combined and get ten pages in Ferdowsi, who says he found nothing about them. Think about why a civilization disappears from its own memory: the Sasanians who followed them wanted it that way.` },
    { title: "The Sasanians, 224–628", intro: `The dynasty that called itself the heir of the Achaemenids, made Zoroastrianism a state church, captured a Roman emperor alive, and fought Rome and Constantinople to a standstill for four centuries. You have met every one of these wars from the Roman side.`, note: `The source to argue with is Procopius, whom you know. In Byzantium he was the Roman eyewitness; here he is the enemy's chronicler, and the same passages on Khosrow look different when you have read the Letter of Tansar and the reform program behind them.` },
    { title: "The conquest and the afterlife, 628–1010", intro: `The empire that had just beaten Rome falls in a decade to the Arabs. Persia then does something no other conquered civilization in these courses managed: it converted, kept its language, and within three centuries was writing its own epic.`, note: `The closing question is Ferdowsi's: what survives a conquest? The Shahnameh has no Achaemenids at all, yet it preserved the Persian language and an idea of Iran so intact that the Safavids, the Mughals, and the Ottoman court all wrote in its language a thousand years later.` }

  lead: `From the first writing at Uruk to Cyrus entering Babylon. Cities, writing, kings, empire, law, and literature are all invented here, in that order, and everything you have read sits on top of it.`,
  spine: [`Amanda Podany, Weavers, Scribes, and Kings — the narrative, read throughout`, `Eric Cline, 1177 B.C. — Weeks 2–3; Eckart Frahm, Assyria — Week 3`, `Marc Van De Mieroop, A History of the Ancient Near East — reference; Irving Finkel, The Ark Before Noah — Week 4`, `Oldest Stories podcast; Paul Cooper's Fall of Civilizations`],
  weeks: [
    { title: "Sumer, Akkad, Ur, and Hammurabi, 3300–1600 BC", intro: `Seventeen centuries in seven classes: how much of what you think of as civilization was worked out once, in southern Iraq, and inherited by everyone after?`, note: `The week's exercise is Gilgamesh Tablet XI against Genesis 6–9. The Babylonian Flood story is older than the Hebrew one by a thousand years, and the overlap in plot and even phrasing is exact enough that the question is not whether Genesis borrowed but how.` },
    { title: "The international age, 1600–1200 BC", intro: `For three centuries the Near East was a club of great kings who wrote to each other as brothers, married each other's daughters, and fought over Syria. Then it all stopped.`, note: `The Amarna letters are the thing to linger on: nearly four hundred tablets from Pharaoh's foreign office, in which the king of Babylon complains that his sister has not written, the king of Mitanni asks for more gold because gold is as dust in Egypt, and the mayors of Canaanite towns beg for fifty archers. They are the first diplomatic archive in history.` },
    { title: "Collapse and the Iron Age, 1200–539 BC", intro: `Within fifty years the Hittite empire vanishes, Ugarit burns, Mycenae falls, and writing disappears from Greece. Out of the wreck come the alphabet, Israel, the Phoenicians, and the Assyrian empire.`, note: `Sennacherib's prism against 2 Kings is the clearest case in all these courses of two sources describing one event from opposite sides. Assyria says Hezekiah was shut up in Jerusalem like a bird in a cage and paid tribute; the Bible says an angel killed 185,000 Assyrians in the night. Both are true in the sense that matters to each author. Work out what happened.` },
    { title: "The civilization itself", intro: `Four thematic classes: what these people believed, how they were governed, what they knew, and how we came to read them at all after two thousand years of silence.`, note: `The month ends at the Behistun cliff, where a British officer dangling on a rope copied Darius's trilingual boast and used the Old Persian to crack Babylonian, which cracked Akkadian, which opened Sumer. Everything you read in the last four weeks was unreadable in 1850.` }

  spine: [`Mark Edward Lewis, the Harvard History of Imperial China: Qin and Han, China Between Empires, China's Cosmopolitan Empire — Weeks 2–4`, `John Keay, China: A History, ch. 1–9 — the through-narrative`, `Li Feng, Early China — Week 1; Bryan Van Norden, Introduction to Classical Chinese Philosophy — the thinkers; Walter Scheidel, Escape from Rome — the capstone`, `Chris Stewart, The History of China podcast; Harvard's ChinaX lectures`],
  weeks: [
    { title: "Shang and Zhou, the philosophers, and the First Emperor, 1200–206 BC", intro: `A thousand years in seven classes: kings who asked the future of cracked bones, the Mandate of Heaven, five centuries of war in which every school of Chinese thought was founded, and the man who ended the war by abolishing everything before him.`, note: `The comparison is the Analects against Plato's Apology. Both are students' records of a teacher who wrote nothing and became the foundation of a civilization's idea of the good life; they could not be more different in what they think the good life is. Notice what kind of question Confucius refuses to answer that Socrates cannot stop asking.` },
    { title: "The Han, 206 BC – AD 220", intro: `Rome's exact contemporary: founded by a peasant the year after Zama, expanded by a warrior-emperor, given its orthodoxy by a historian the emperor castrated, and destroyed by eunuchs, generals, and a peasant religion in the same decades the Roman Empire was coming apart.`, note: `Sima Qian chose castration over death so he could finish his father's history, then wrote a hundred and thirty chapters that invented the form every later Chinese historian followed, and let his contempt for the emperor who mutilated him show in every chapter about him. The Letter to Ren An is the closest thing in ancient literature to a historian explaining why he does it.` },
    { title: "Disunion, Buddhism, and the Tang, 220–755", intro: `Three and a half centuries of division, in which nomads rule the north, aesthetes rule the south, and an Indian religion conquers both; then a reunification that holds. This is where China's story diverges from Rome's: the barbarian kingdoms became Chinese, and the empire came back.`, note: `Christianity conquered Rome from inside, as the religion of the poor and then the emperors; Buddhism entered China from outside, through merchants and monks, as a foreign philosophy that the nomad rulers of the north adopted partly because it was not Confucian. Both took three centuries, and both ended up state religions the state later turned on. Notice what travelled and what did not.` },
    { title: "An Lushan and the long fall, 755–907", intro: `The rebellion that broke the Tang in a winter, the poet who walked through the ruins, the century and a half of recovery and decay that followed, and a last class on the question the whole month has been circling.`, note: `Scheidel's argument is that Rome's failure to return was the most important fact in world history: because no empire could reunify Europe, its fragments competed, and competition produced the modern world; China reunified every time and did not. You are one of a small number of people who have read both halves of the comparison from the sources.` }

  lead: `The African states your other courses mention and never explain: Kush, which conquered Egypt; Aksum, which minted gold and converted to Christianity before Rome; the Christian kingdoms of Nubia, which held off the Arabs for six centuries; and Ethiopia, which built churches out of living rock and met the Portuguese as an equal.`,
  spine: [`François-Xavier Fauvelle, The Golden Rhinoceros — the thematic companion, short chapters`, `Derek Welsby, The Kingdom of Kush and The Medieval Kingdoms of Nubia — Weeks 1 and 3`, `Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity — Week 2, free online`, `Harold Marcus, A History of Ethiopia — Week 4; History of Africa Podcast; Lost Kingdoms of Africa (BBC)`],
  weeks: [
    { title: "Kush: Kerma, Napata, and the Black Pharaohs, 2500–300 BC", intro: `Nubia was Egypt's rival, colony, and finally its conqueror. Kerma, the first Nubian kingdom; the Egyptian empire in Nubia; the Napatan kings who took Egypt as the 25th Dynasty; and the retreat to Meroë.`, note: `The source problem is Egypt's. Almost everything written about Nubia before Meroë was written by Egyptians, for whom Nubia was a frontier of gold, soldiers, and ivory, and the Kushite kings themselves wrote in Egyptian hieroglyphs in a pharaonic idiom. Piye's stela, which you read in Egypt's course, is a Nubian king out-Egyptianizing the Egyptians; ask what that tells you about who the audience was.` },
    { title: "Meroë and Aksum, 300 BC – AD 700", intro: `Meroë, with its own script that no one can yet read, its iron, and its ruling queens; and Aksum, the trading empire on the Red Sea that Mani ranked with Rome, Persia, and China, and that converted to Christianity under Ezana in the 330s.`, note: `Aksum is the week's demonstration that Africa was inside the ancient world, not beside it: its coins circulate in India, its king intervenes in Arabia, its bishops are consecrated in Alexandria, Procopius reports Justinian's embassy to it. Munro-Hay's book is free online and the best thing written on it; read the Ezana inscriptions in his translation.` },

  lead: `Two African worlds joined to the Islamic one by caravan and monsoon: the gold empires of the Sahel, where Mansa Musa's pilgrimage crashed the price of gold in Cairo and Timbuktu bought more books than anything else, and the stone cities of the Swahili coast trading with Arabia, India, and China. The sources are Arabic geographers, oral epics, and archaeology, which is a method shift from everything before.`,
  spine: [`François-Xavier Fauvelle, The Golden Rhinoceros — the companion, carried over`, `Michael Gomez, African Dominion — the modern standard for the Sahel, read in pieces`, `Nehemia Levtzion, Ancient Ghana and Mali — the classic, Weeks 1–2; Horton and Middleton, The Swahili — Week 3`, `History of Africa Podcast; Fall of Civilizations; Lost Kingdoms of Africa (BBC)`],
  weeks: [
    { title: "The Sahara, Ghana, and the trade, 500–1200", intro: `The camel, the salt, and the gold: how the Sahara became a sea with ports on both shores, and how Wagadu, called Ghana by the Arabs, grew rich on crossing it.`, note: `Al-Bakri wrote the best description of Ghana in 1068 from Córdoba, without ever going, from merchants' reports. Everything written about the early Sahel is like that: Arabic, external, secondhand, and interested in gold. Read it the way you read Herodotus on Egypt and Carpini on the Mongols, and notice what the archaeology at Koumbi Saleh and Gao confirms and contradicts.` },
    { title: "Mali and Songhai, 1230–1591", intro: `Sundiata founds Mali; Mansa Musa shows it to the world; Ibn Battuta visits; Timbuktu becomes a university town; Sunni Ali and Askia Muhammad build Songhai on its ruins; and a Moroccan army with muskets ends it all in 1591.`, note: `The Sundiata epic was recited by griots for seven centuries before it was written down, and Niane's version is one griot's telling from the 1950s. The Tarikh al-Sudan was written in Timbuktu in the 1650s by a scholar looking back on the Songhai golden age. Hold the oral and the written together; the Mali you get from each is not the same Mali.` },
    { title: "The Swahili coast and the Indian Ocean, 800–1500", intro: `Kilwa, Mombasa, Zanzibar, Mogadishu: stone towns on the coral coast, Muslim and African, speaking a Bantu language full of Arabic, trading gold from Great Zimbabwe for porcelain from China. Zheng He's fleets came; the Portuguese came after.`, note: `The Swahili are the test case for the Mongol question in a different key: were the coastal towns African, Arab, or something that could only exist between? Horton and Middleton's answer, that they were African merchants who adopted Islam and Arabic script and built a culture of their own, has replaced the old colonial story of Arab colonists; see whether the Kilwa Chronicle and Ibn Battuta support it.` },
    { title: "The interior, the Atlantic, and the end of the medieval order, 1100–1600", intro: `Great Zimbabwe and Mapungubwe, Kanem-Bornu and the Hausa cities, Benin and Ife, and the Portuguese arriving on both coasts within a decade of each other. The month ends where the Atlantic world begins.`, note: `Great Zimbabwe was attributed by colonial Rhodesia to Phoenicians, Arabs, anyone but Africans, until the archaeology made that impossible; the political history of who was allowed to have built it is part of the subject. Fauvelle's method, a chapter per site, per object, per document, is the right one for a history whose written sources are thin and whose material ones are rich.` }
  ],

{
  id: "india", order: 14, title: "India", subtitle: "The Indus to Aurangzeb, 2600 BC – 1707",
  lead: `The subcontinent from the Indus cities to the last great Mughal: the Vedas, the Buddha, Ashoka's edicts, the Guptas, the Cholas' ocean empire, the Delhi sultans, Vijayanagara, and the Mughals in full, which the Islamic course only touched. The sources are the richest religious literature on earth and a historical record that, until the Muslims arrived, almost refused to be written.`,
  spine: [`John Keay, India: A History — the narrative, read throughout`, `Romila Thapar, Early India — rigorous, to 1300`, `Richard Eaton, India in the Persianate Age — rigorous, 1000–1765; Asher and Talbot, India Before Europe — Weeks 3–4`, `Kit Patrick, The History of India Podcast; Empire's Mughal episodes; Michael Wood, The Story of India (BBC)`],
  weeks: [
    { title: "The Indus, the Vedas, and the Buddha, 2600–300 BC", intro: `Cities with drains and no palaces, whose script is unread; the Vedic hymns, memorized unchanged for three thousand years; the Upanishads; the Buddha and Mahavira; and the first kingdoms of the Ganges.`, note: `India's early history has almost no dates, because Indian tradition did not write chronicles: the Vedas were transmitted orally with a precision no manuscript matched, and no one thought to record which king came when. Thapar is the guide to how historians reconstruct a chronology from texts that refuse to give one, and the week's exercise is to notice how different that is from Sima Qian's China.` },
    { title: "Mauryas, Guptas, and the South, 320 BC – AD 1200", intro: `Chandragupta and Kautilya's state, Ashoka's remorse carved on rocks across the subcontinent, the Greeks and Kushans, the Gupta golden age and its mathematics, Kalidasa, the Tamil kingdoms, and the Cholas sailing to Sumatra.`, note: `Ashoka's edicts are the first royal inscriptions in India and unlike any other king's in your courses: a ruler who conquered Kalinga, counted the dead, and had his regret published across his empire in the local languages. Compare him to Darius at Behistun and Augustus in the Res Gestae, and decide whether the remorse was policy.` },
    { title: "The sultans and the South, 1000–1526", intro: `Mahmud of Ghazni's raids, the Delhi Sultanate from the Slave kings to the Tughluqs, Ibn Battuta as a judge in Delhi, the Bhakti saints and the Sufis, Vijayanagara's capital that the Portuguese thought the largest city in the world, and Babur at Panipat.`, note: `Eaton's argument runs under the week: that the Persianate order the sultans brought was not an alien imposition but a cosmopolitan culture Indian elites adopted and adapted, the way they had adopted Sanskrit, and that Vijayanagara's Hindu kings dressed, titled, and fought like sultans. See whether the sources, especially Paes and Nuniz, bear it out.` },
    { title: "The Mughals, 1526–1707", intro: `Babur's memoirs, Humayun's exile, Akbar's experiment in a religion of his own, Jahangir's paintings, Shah Jahan's Taj, Aurangzeb's long wars, and the Sikhs and Marathas who outlasted them.`, note: `The Mughals are the best-documented dynasty in your fifteen courses: two emperors wrote their own memoirs, Akbar had his reign chronicled day by day, and European visitors described the court in detail. The quarrel is over Aurangzeb, pious restorer or bigoted destroyer, and it is a live political question in India today. Audrey Truschke's short book makes the revisionist case; read the sources before you take a side.` }

    if(!inStr){ const closers=stack.reverse().map(c=>c==="{"?"}":"]").join(""); try{ return JSON.parse(sanitizeJSON(piece+closers)); }catch(e){} } cut=i; }
  throw new Error("JSON"); }

/* ---------- the shape of the written work: intensity, how many sources, and what it is about ---------- */
const INTENSITY=[["light","light","Ten to fifteen minutes. One clear question, your understanding and a reason or two; no full argument."],["standard","standard","The usual seminar piece: an argument with evidence, twenty to thirty minutes."],["deep","demanding","A real historical problem with a counter-position to handle; forty-five minutes to an hour."]];
const SRCCOUNT=[["memory","from memory","Nothing to look up: answerable from what you took in and your own thinking."],["one","one source","Built on one assigned source, named."],["two","two sources","Two sources set against each other."],["all","all of them","Draws on the whole set of assigned materials."]];
function workPrefs(){ const w=(S.ui||{}).work||{}; return {intensity:INTENSITY.some(x=>x[0]===w.intensity)?w.intensity:"standard",sources:SRCCOUNT.some(x=>x[0]===w.sources)?w.sources:"one",focus:String(w.focus||"")}; }
function setWorkPref(k,v){ S.ui=S.ui||{}; S.ui.work=S.ui.work||{}; S.ui.work[k]=v; S.ui._t=now(); save(); }
function classFocus(st){ return String((st&&st.focus)||"").trim()||workPrefs().focus.trim(); }
function workText(st){ const w=workPrefs(); const f=classFocus(st);
  const I={light:"INTENSITY: light. The student is here to understand and enjoy the material, not to produce scholarship. Set one clear question she can answer in 10–15 minutes from what she took in; ask for her understanding and one or two reasons, not a full argument. Rubric, if any: did she grasp the main idea and give a reason. Grade proportionately: a short, sound answer earns full credit.",
    standard:"INTENSITY: standard. A seminar piece: an argument supported by evidence, twenty to thirty minutes of work.",
    deep:"INTENSITY: demanding. A real historical problem with a counter-position she must handle; expect a structured argument weighing evidence from several sources, forty-five minutes to an hour; grade as a graduate seminar would."}[w.intensity];
  const C={memory:"SOURCES: nothing to look up. The task must be answerable from memory of the materials and her own thinking; never ask her to quote, cite, or find a passage.",one:"SOURCES: one assigned source, named in the task.",two:"SOURCES: two assigned sources, set against each other.",all:"SOURCES: the whole set of assigned materials."}[w.sources];
  return `\n\n${I}\n${C}${f?`\nFOCUS: she has asked that the written work be about: "${f}". Build the task around that, within this class's material; if it does not fit this class, come as close as the material allows and say so in one line.`:""}`; }
function workPanel(id,st){ const w=workPrefs(); const seg=(name,list,cur)=>`<span class="gm"><span class="lbl">${name}</span>${list.map(([v,l,t])=>`<button class="${cur===v?"on":""}" data-wp="${name==="Intensity"?"intensity":"sources"}" data-v="${v}" title="${esc(t)}">${l}</button>`).join("")}</span>`;
  return `<div class="workpanel" id="${id}"><div class="row" style="gap:8px 18px;flex-wrap:wrap">${seg("Intensity",INTENSITY,w.intensity)}${seg("Sources",SRCCOUNT,w.sources)}</div><div class="row" style="margin-top:8px;gap:8px"><span class="gm"><span class="lbl">About</span></span><input class="focus" data-focus placeholder="${esc(w.focus?w.focus:"optional: a theme, a person, a question you want to chase")}" value="${esc(st&&st.focus?st.focus:"")}"></div><p class="hint wphint">${esc(INTENSITY.find(x=>x[0]===w.intensity)[2])} ${esc(SRCCOUNT.find(x=>x[0]===w.sources)[2])}${w.focus&&!(st&&st.focus)?` Standing focus from Settings: “${esc(w.focus)}”.`:""}</p></div>`; }

/* ---------- discussion level: how much the questions ask of you ---------- */
const DLEVELS=[["open","open","Big questions you can carry on a walk. Answerable from the gist and your own thinking; nothing to look up."],["seminar","seminar","Anchored in the sources, asking for your reading and judgement, not for quoted passages."],["close","close reading","The full seminar: set passages against each other, cite, and argue from the text."]];
function discLevel(){ const v=(S.ui||{}).discLevel; return DLEVELS.some(d=>d[0]===v)?v:"seminar"; }
function setDiscLevel(v){ S.ui=S.ui||{}; S.ui.discLevel=DLEVELS.some(d=>d[0]===v)?v:"seminar"; S.ui._t=now(); save(); }
function discPrompt(){ const L=discLevel();
  if(L==="open") return `Write three discussion questions for this class that a thoughtful person could sit with on a walk after taking the sources in once. Low entry: each must be answerable from the gist of the material and the student's own thinking. No quoting, no page or section references, no "compare passage X with Y", no "find where the author says". Make them thought-provoking rather than demanding: a tension to weigh, a judgement call, what you would have done, why this mattered, what it reminds you of. You may name a source in passing as a nudge, never as a requirement. One sentence each, plain language, 30 words or fewer. No yes/no questions. Return JSON only: {"questions":["...","...","..."]}`;
  if(L==="seminar") return `Write three discussion questions for this class. Each should be open and argumentative and anchored in the assigned sources (name them), but it must ask for the student's reading and judgement, not for citations or quoted passages: she should be able to answer from memory of what the sources said and argued. At least one sets two sources or two views against each other. None may require pulling a specific passage or line. One or two sentences each. No yes/no questions. Return JSON only, with every line break inside a string written as \\n: {"questions":["...","...","..."]}`;
  return `Write three discussion questions for this class. Each should be open, argumentative, and anchored in the assigned sources (name them), the kind a good seminar leader would open with; at least one should set two sources against each other, and one should connect to the week's method note. No yes/no questions. Return JSON only, with every line break inside a string written as \\n: {"questions":["...","...","..."]}`; }
function discReplyPrompt(q){ const L=discLevel();
  if(L==="open") return `\n\nYou are leading a relaxed spoken-style discussion; the student may be answering on the move, from memory. The question is: "${q}". Respond to her latest contribution in 80–150 words: take her thinking seriously and build on it, add one concrete thing from the sources she may not have known, gently correct anything plainly wrong, and end with one open follow-up question she can answer without looking anything up. Never ask her to quote, cite, or find a passage. No preamble, no praise for its own sake.`;
  if(L==="seminar") return `\n\nYou are leading a written seminar discussion. The question is: "${q}". Respond to the student's latest contribution in 120–200 words: engage her specific claims, push back where the reasoning is loose, add one thing from the assigned sources she has not used, and end with one follow-up question that asks for judgement, not for a citation. Do not ask her to quote or locate passages. No preamble, no praise for its own sake.`;
  return `\n\nYou are leading a written seminar discussion. The discussion question is: "${q}". Respond to the student's latest contribution in 120–220 words: engage her specific claims, push back where the evidence is thin or the reading of a source is loose, add one thing from the assigned sources she has not used, and end with one sharper follow-up question. No preamble, no praise for its own sake.`; }
function discToggle(id){ const L=discLevel(); return `<span class="gm" id="${id}"><span class="lbl">Questions</span>${DLEVELS.map(([v,l,t])=>`<button class="${L===v?"on":""}" data-dl="${v}" title="${esc(t)}">${l}</button>`).join("")}</span>`; }
function bindDiscToggle(root,onchange){ $$("[data-dl]",root).forEach(b=>b.onclick=()=>{ setDiscLevel(b.dataset.dl); $$("[data-dl]",root).forEach(x=>x.classList.toggle("on",x.dataset.dl===discLevel())); if(onchange) onchange(); }); }
function baseSystem(){ return `You are the professor of a rigorous, self-directed, graduate-style seminar in history. The student is ${STUDENT}: an adult learner with a strong academic background (economics BA, published research, a working high-school engineering teacher) who reads primary sources closely and is considering a master's in history. Treat her as a capable graduate student: be warm but demanding, specific rather than general, and always push toward evidence, argument, and the sources. Never flatter. Never invent quotations or page numbers; when you are unsure of a detail, say so. Refer to the assigned sources by name. Address her as Laine when it is natural.\n\n${gradeModeText()}${profileText()?`\n\nYour private notes on this student from earlier courses (use them; never quote them to her):\n${profileText()}`:""}`; }
function professorSystem(course,idx){ const k=idx!=null?course.classes[idx]:null; const w=idx!=null?course.weeks[Math.min(3,Math.floor(idx/7))]:null;
  let s=baseSystem()+`\n\nCourse: ${course.title} (${course.subtitle}). ${course.lead}\nCourse spine: ${course.spine.join(" | ")}\nThe course has 25 classes in four weeks; classes are not tied to calendar dates.`;
  if(k){ s+=`\n\nCurrent class: Class ${idx+1} of 25, "${k.title}".\nAssigned video: ${k.video}\nAssigned podcast: ${k.podcast}\nAssigned reading: ${k.reading}${k.culture?`\nOptional culture strand (literature, art, music): ${k.culture}`:""}${k.art?`\nOptional buildings and engineering strand: ${k.art}`:""}${k.things?`\nOptional objects strand (clothes, pottery, textiles, tools, coins): ${k.things}`:""}${k.life?`\nOptional daily-life strand: ${k.life}`:""}${k.maps?`\nOptional maps strand: ${k.maps}`:""}\nWeek ${Math.min(4,Math.floor(idx/7)+1)}: ${w.title}. ${w.intro}\nWeek method note: ${w.note}`;
    const nt=notesText(course.id,idx); if(nt.trim()) s+=`\n\nThe student's own notes for this class, grouped by source in [brackets] (use them when relevant; do not quote them back at length):\n${nt.slice(0,4000)}`; const qt=quotesText(course.id,idx); if(qt.trim()) s+=`\n\nPassages the student has saved from the sources for this class (she may cite them; credit her when she uses them well):\n${qt.slice(0,2500)}`; }
  else { const qt=quotesText(course.id,null); if(qt.trim()) s+=`\n\nPassages the student has saved from the course's sources:\n${qt.slice(0,3000)}`; }
  s+=`\n\nThe courses in the sequence: ${COURSES.map(c=>c.title).join(", ")}. Draw comparisons across them when they illuminate the current material.`; return s; }
function capstoneSystem(cap){ const cs=cap.courses.map(id=>COURSES.find(c=>c.id===id)).filter(Boolean);
  return baseSystem()+`\n\nThis is a capstone synthesis essay spanning several courses. The courses involved:\n`+cs.map(c=>`- ${c.title} (${c.subtitle}): ${c.lead} Week notes: ${c.weeks.map(w=>w.note).join(" ")}`).join("\n")+`\n\nGrade for argument, use of specific evidence from the primary sources of each course named, fairness to the counter-case, and clarity.`; }


/* ---------- reply shapes (normalize what the professor returns) ---------- */
function str(x){ return x==null?"":(typeof x==="string"?x:(typeof x==="object"?(x.text||x.prompt||x.question||x.q||JSON.stringify(x)):String(x))); }
function strList(x){ if(Array.isArray(x)) return x.map(str).filter(t=>t.trim()); if(x&&typeof x==="object") return Object.values(x).map(str).filter(t=>t.trim()); if(typeof x==="string"&&x.trim()){ const t=x.trim(); const parts=/\n/.test(t)?t.split(/\n+/):(/;\s/.test(t)?t.split(/;\s*/):(/^\s*(?:\d+[.)]|[-•*])\s/.test(t)&&t.split(/\s*(?:^|\s)(?:\d+[.)]|[-•*])\s+/).filter(Boolean).length>1?t.split(/\s*(?:^|\s)(?:\d+[.)]|[-•*])\s+/):[t])); return parts.map(p=>p.replace(/^\s*(?:\d+[.)]|[-•*])\s*/,"").trim()).filter(Boolean); } return []; }
function letterIdx(a){ const m=String(a).trim().match(/^\(?([a-dA-D])\)?[.)]?$/); return m?"abcd".indexOf(m[1].toLowerCase()):-1; }
function normMCQ(it){ if(!it||typeof it!=="object") return null; const q=str(it.q||it.question||it.prompt); let options=strList(it.options||it.choices||it.answers); if(!q||options.length<2) return null;
  let a=it.answer; if(a==null) a=it.correct; if(a==null) a=it.correct_index; let idx=-1;
  if(typeof a==="number"){ idx=a; if(idx>=options.length&&idx-1>=0&&idx-1<options.length) idx=idx-1; }
  else if(typeof a==="string"){ const li=letterIdx(a); if(li>=0&&li<options.length) idx=li; else if(/^\d+$/.test(a.trim())){ idx=+a; if(idx>=options.length) idx-=1; } else { idx=options.findIndex(o=>o.trim().toLowerCase()===a.trim().toLowerCase()); if(idx<0) idx=options.findIndex(o=>o.toLowerCase().includes(a.trim().toLowerCase())||a.toLowerCase().includes(o.trim().toLowerCase())); } }
  if(idx<0||idx>=options.length) return null; return {q,options,answer:idx,explanation:str(it.explanation||it.why||"")}; }
function normalize(what,out){ out=out||{}; let r;
  if(what==="discussion"){ const qs=strList(out.questions||out.discussion||(Array.isArray(out)?out:[])); r=qs.length>=1?{questions:qs.slice(0,5)}:null; }
  else if(what==="assignment"){ const prompt=str(out.prompt||out.assignment||out.question); r=prompt.trim()?{prompt,rubric:strList(out.rubric||out.criteria),length:str(out.length||out.target_length||"300–500 words")}:null; }
  else if(what==="homework"){ const prompt=str(out.prompt||out.task||out.homework); r=prompt.trim()?{source:str(out.source||out.text||""),prompt}:null; }
  else if(what==="quiz"){ const qs=(Array.isArray(out.questions)?out.questions:(Array.isArray(out)?out:[])).map(normMCQ).filter(Boolean); r=qs.length>=3?{questions:qs}:null; }
  else if(what==="flashcards"){ const cs=(Array.isArray(out.cards)?out.cards:(Array.isArray(out)?out:[])).map(c=>({front:str(c&&(c.front||c.term||c.q)),back:str(c&&(c.back||c.definition||c.a))})).filter(c=>c.front.trim()&&c.back.trim()); r=cs.length>=3?{cards:cs}:null; }
  else if(what==="exam"){ const mcq=(Array.isArray(out.mcq)?out.mcq:(Array.isArray(out.questions)?out.questions:[])).map(normMCQ).filter(Boolean); const short=strList(out.short||out.essays||out.short_answer||out.partB); r=mcq.length>=4&&short.length>=1?{mcq,short}:null; }
  else if(what==="grade"){ let sc=out.score; if(typeof sc==="string"){ const m=sc.match(/\d+(\.\d+)?/); sc=m?+m[0]:NaN; } if(typeof sc!=="number"||!isFinite(sc)) return null; sc=Math.max(0,Math.min(100,sc)); r={score:sc,letter:str(out.letter||out.grade||"").trim()||letter(sc),feedback:str(out.feedback||out.comments||""),strengths:strList(out.strengths),improvements:strList(out.improvements||out.weaknesses)}; }
  else if(what==="gradeShort"){ let scores=Array.isArray(out.scores)?out.scores:(Array.isArray(out)?out.map(x=>x&&x.score):[]); scores=scores.map(x=>{ if(typeof x==="string"){ const m=x.match(/\d+(\.\d+)?/); x=m?+m[0]:NaN; } if(x&&typeof x==="object") x=+x.score; return typeof x==="number"&&isFinite(x)?Math.max(0,Math.min(100,x)):null; }); const feedback=strList(out.feedback||out.comments); r=scores.length&&scores.every(x=>x!=null)?{scores,feedback}:null; }
  else r=out;
  if(!r) throw new Error("SHAPE"); return r; }
function validGen(what,g){ try{ return !!normalize(what,g); }catch(e){ return false; } }

async function ensureGen(course,idx,what){ const st=kstate(course.id,idx); if(st.gen[what]) return st.gen[what]; const sys=professorSystem(course,idx)+((what==="assignment"||what==="homework")?workText(st):""); let user,max=1800;
  if(what==="lecture") user=`Write the opening briefing for this class, as the professor would deliver it before the student does the assigned video, podcast, and reading. About 450–600 words, in markdown with short headings. Include: (1) what this class is really about and why it sits here in the course; (2) three specific things to watch for in the assigned materials, naming the sources; (2b) under a heading "How to read today's sources", two or three sentences of method particular to these exact materials: what kind of text each is, what it can and cannot tell her, and the order to take them in; (3) two or three key terms or names she must know by the end; (4) one connection to another course in the sequence. End with a single question to hold in mind while reading. Return markdown only.`;
  else if(what==="discussion"){ user=discPrompt(); max=2200; }
  else if(what==="assignment"){ user=gradeMode()==="content"?`Set the written assignment for this class, following the INTENSITY, SOURCES, and FOCUS settings above: a question that requires an argument supported by specific evidence from the assigned reading. Give the prompt and a three-point rubric about understanding and evidence only (nothing about prose, structure, or length). Return JSON only, with every line break inside a string written as \\n: {"prompt":"...","rubric":["...","...","..."],"length":"any length or format; notes and bullet points are fine"}`:`Set the written assignment for this class, following the INTENSITY, SOURCES, and FOCUS settings above: a 300–500 word response that requires an argument supported by specific evidence from the assigned reading. Give the prompt, a three-point rubric, and the target length. Return JSON only, with every line break inside a string written as \\n: {"prompt":"...","rubric":["...","...","..."],"length":"300–500 words"}`; max=2500; }
  else if(what==="homework"){ const w=workPrefs(); user=`Set the homework for this class: ${w.sources==="memory"?"a short reflective task answerable from memory of the materials":w.sources==="all"?"a source-analysis task across the assigned materials":w.sources==="two"?"a source-analysis task setting two assigned sources against each other":"a close-reading or source-analysis task on one specific assigned primary source (or, if none is assigned, on one passage of the secondary reading)"}. ${w.intensity==="light"?"Ask one thing: what the source (or the material) is trying to do and one thing it leaves out or that surprised her. Ten to fifteen minutes.":w.intensity==="deep"?"Ask her to identify purpose, audience, claim, omissions, what a historian can and cannot conclude, and how the source sits against the others; forty-five minutes to an hour.":"Ask her to identify the author's purpose, audience, what the text claims, what it leaves out, and one thing a historian can and cannot conclude from it. Keep it to a task she can finish in 20–30 minutes of writing."} Follow the INTENSITY, SOURCES, and FOCUS settings above. Return JSON only, with every line break inside a string written as \\n: {"source":"the source named","prompt":"..."}`; max=2200; }
  else if(what==="quiz"){ user=`Write a five-question multiple-choice quiz on this class's assigned materials. Mix factual recall (names, dates, events) with interpretation (what a source argues, why an event mattered). Four options each, one correct, plausible distractors, and a one-sentence explanation for each answer. Return JSON only: {"questions":[{"q":"...","options":["...","...","...","..."],"answer":0,"explanation":"..."}]}`; max=4000; }
  else if(what==="flashcards"){ user=`Write eight review cards for this class: the names, dates, terms, and arguments she must retain. Front is a short prompt (a name, a term, a date, or a "what did X argue" question); back is a crisp answer of one or two sentences with the source named where relevant. Return JSON only: {"cards":[{"front":"...","back":"..."}]}`; max=3500; }
  let out=await claude(sys,[{role:"user",content:user}],{json:what!=="lecture",max}); if(what!=="lecture") out=normalize(what,out); else if(!String(out).trim()) throw new Error("SHAPE"); st.gen[what]=out; stamp(st); save(); return out; }
async function ensureExam(course,which){ const c=cstate(course.id); c.exams[which]=c.exams[which]||{}; if(c.exams[which].paper) return c.exams[which].paper; const sys=professorSystem(course,null); let scope,n,nshort,max;
  if(which==="final"){ scope=`the whole course, all 25 classes`; n=20; nshort=3; max=8000; } else { const w=parseInt(which.slice(1))-1; const from=w*7,to=Math.min(24,from+6); scope=`Week ${w+1} (${course.weeks[w].title}), classes ${from+1}–${to+1}: ${course.classes.slice(from,to+1).map((k,i)=>`Class ${from+i+1}: ${k.title} (reading: ${k.reading})`).join("; ")}`; n=10; nshort=2; max=4500; }
  const user=`Write an exam covering ${scope}. Part A: ${n} multiple-choice questions, four options each, one correct, mixing recall and interpretation, with a one-sentence explanation per answer. Part B: ${nshort} short-answer prompts (${which==="final"?"essay questions, 250–400 words each, requiring an argument across several classes and at least two sources":"150–250 words each, requiring evidence from the assigned sources"}). Return JSON only: {"mcq":[{"q":"...","options":["...","...","...","..."],"answer":0,"explanation":"..."}],"short":["...","..."]}`;
  const paper=normalize("exam",await claude(sys,[{role:"user",content:user}],{json:true,max})); c.exams[which].paper=paper; stamp(c.exams[which]); save(); return paper; }
async function grade(sys,kind,prompt,answer,rubric){ const user=`Grade this ${kind}. Score it 0–100 and give a letter grade. Be rigorous and specific: quote or point to what in her answer earns or loses credit, name what evidence from the assigned sources is missing, and say exactly what a stronger version would do. Do not inflate.${gradeMode()==="content"?" Grade content only: do not mention or penalize writing, format, or length.":""}\n${rubric?`Rubric: ${rubric.join(" / ")}`:""}\nPROMPT:\n${prompt}\n\nSTUDENT ANSWER:\n${answer}\n\nReturn JSON only, with every line break inside a string written as \\n: {"score":87,"letter":"B+","feedback":"markdown, 120–220 words","strengths":["..."],"improvements":["..."]}`;
  const r=normalize("grade",await claude(sys,[{role:"user",content:user}],{json:true,max:1800})); r.mode=gradeMode(); return r; }
async function gradeShort(course,which,prompts,answers){ const sys=professorSystem(course,null); const user=`Grade the short-answer part of the ${which==="final"?"final exam":"week exam"}. For each answer give a score 0–100 and two or three sentences of specific feedback, pointing to missing evidence and naming the sources she should have used. Do not inflate.\n${prompts.map((p,i)=>`QUESTION ${i+1}: ${p}\nANSWER ${i+1}: ${answers[i]||"(no answer)"}`).join("\n\n")}\n\nReturn JSON only, with every line break inside a string written as \\n: {"scores":[..],"feedback":["...",".."]}`;
  const r=normalize("gradeShort",await claude(sys,[{role:"user",content:user}],{json:true,max:2000})); while(r.scores.length<prompts.length) r.scores.push(r.scores[r.scores.length-1]||0); while(r.feedback.length<prompts.length) r.feedback.push(""); return r; }

const INTERVALS=[1,3,7,14,30,60];
function cards(){ S.review=S.review||{cards:{}}; return S.review.cards; }
function addCard(id,cid,front,back,src){ const c=cards(); if(c[id]) return; c[id]={id,cid,front,back,src,box:0,due:now(),_t:now()}; save(); }
function dueCards(){ const t=now(); return Object.values(cards()).filter(c=>c.due<=t).sort((a,b)=>a.due-b.due); }

function hash(t){ let h=5381; for(const ch of String(t)) h=((h<<5)+h+ch.charCodeAt(0))|0; return (h>>>0).toString(36); }
function addWrongFromQuiz(cid,i,qz,answers){ qz.forEach((it,qi)=>{ if(answers[qi]!==it.answer) addCard(`q:${cid}:${i}:${hash(it.q)}`,cid,it.q,`${it.options[it.answer]}. ${it.explanation||""}`,"quiz"); }); }
function addWrongFromExam(cid,which,paper,answers){ paper.mcq.forEach((it,qi)=>{ if(answers[qi]!==it.answer) addCard(`x:${cid}:${which}:${hash(it.q)}`,cid,it.q,`${it.options[it.answer]}. ${it.explanation||""}`,"exam"); }); }

/* ---------- scores ---------- */
function classScores(cid){ const c=cstate(cid),out={discussion:[],homework:[],assignment:[],quiz:[]}; for(let i=0;i<25;i++){ const k=c.classes[i]; if(!k) continue;
  if(k.disc&&k.disc.some(d=>d.thread&&d.thread.length)) out.discussion.push(Math.min(100,70+10*k.disc.filter(d=>d.thread&&d.thread.length).length));
  if(typeof k.hw?.score==="number") out.homework.push(k.hw.score); if(typeof k.assign?.score==="number") out.assignment.push(k.assign.score); if(typeof k.quiz?.score==="number") out.quiz.push(k.quiz.score); } return out; }
function examScore(ex){ if(!ex||!ex.paper||typeof ex.mcqScore!=="number") return null; const p=[ex.mcqScore]; if(typeof ex.shortScore==="number") p.push(ex.shortScore); return avg(p); }
function courseGrade(cid){ const s=classScores(cid),c=cstate(cid); const parts=[["discussion",avg(s.discussion)],["homework",avg(s.homework)],["assignment",avg(s.assignment)],["quiz",avg(s.quiz)],["weekExam",avg(["w1","w2","w3","w4"].map(w=>examScore(c.exams[w])))],["final",examScore(c.exams.final)],["oral",avg(oralScores(cid))]].filter(([k])=>({discussion:"discussion",homework:"homework",assignment:"assignment",quiz:"quiz",weekExam:"exams",final:"exams",oral:"orals"})[k]).filter(([k])=>doing(({discussion:"discussion",homework:"homework",assignment:"assignment",quiz:"quiz",weekExam:"exams",final:"exams",oral:"orals"})[k]));
  let num=0,den=0; for(const [k,v] of parts){ if(typeof v==="number"){ num+=v*WEIGHTS[k]; den+=WEIGHTS[k]; } } return {parts:Object.fromEntries(parts),overall:den?num/den:null}; }
function classDone(cid,i){ const k=cstate(cid).classes[i]; if(!k) return false; const m=k.mat||{}; const ok=(part,rec)=>!doing(part)||!!(rec&&(rec.skipped||typeof rec.score==="number")); return !!(m.video&&m.podcast&&m.reading&&ok("quiz",k.quiz)&&ok("assignment",k.assign)); }
function classStarted(cid,i){ const k=cstate(cid).classes[i]; if(!k) return false; const m=k.mat||{}; return !!(m.video||m.podcast||m.reading||hasNotes(cid,i)||k.disc.some(d=>d.thread&&d.thread.length)||typeof k.quiz?.score==="number"||typeof k.assign?.score==="number"||typeof k.hw?.score==="number"); }
function courseProgress(cid){ let n=0; for(let i=0;i<25;i++) if(classDone(cid,i)) n++; return n; }
function nextClass(cid){ for(let i=0;i<25;i++) if(!classDone(cid,i)) return i; return null; }
function lastActivity(cid){ const c=cstate(cid); let t=0; Object.values(c.classes).forEach(k=>{ t=Math.max(t,k._t||0); }); Object.values(c.exams).forEach(e=>{ t=Math.max(t,e._t||0); }); Object.values(c.sources||{}).forEach(s=>Object.values(s.t||{}).forEach(x=>{ t=Math.max(t,x||0); })); return t; }
function capstoneScores(){ return Object.values(S.capstones||{}).map(c=>c.score).filter(x=>typeof x==="number"); }

/* ---------- planner (forgiving) ---------- */
function plan(cid){ const c=cstate(cid); const p=c.plan; if(!p||!p.target) return null; const target=new Date(p.target+"T23:59:59"); const left=Math.max(0,(target-now())/DAY); const remaining=25-courseProgress(cid); const weeks=left/7;
  return {target:p.target,daysLeft:Math.ceil(left),remaining,perWeek:remaining<=0?0:(weeks<=0?remaining:Math.ceil(remaining/Math.max(weeks,1/7))),perDay:remaining<=0?0:(left<=0?remaining:remaining/left)}; }

/* ---------- sync (GitHub Gist) ---------- */
const GH="https://api.github.com";

async function findGist(){ let id=localStorage.getItem(GISTKEY); if(id){ try{ const g=await gh("GET","/gists/"+id); if(g&&g.files&&g.files["the-seminar-state.json"]) return g; }catch(e){} }
  for(let page=1;page<=5;page++){ const list=await gh("GET",`/gists?per_page=100&page=${page}`); if(!list.length) break; const hit=list.find(g=>g.files&&g.files["the-seminar-state.json"]); if(hit){ localStorage.setItem(GISTKEY,hit.id); return gh("GET","/gists/"+hit.id); } } return null; }
async function remoteState(){ const g=await findGist(); if(!g) return null; const f=g.files["the-seminar-state.json"]; let txt=f.content; if(f.truncated){ const r=await fetch(f.raw_url); txt=await r.text(); } try{ return JSON.parse(txt); }catch(e){ return null; } }
function mergeStates(a,b){ return mergeInto(JSON.parse(JSON.stringify(a)),b); }
function mergeInto(out,b){ b=b||{}; let changed=false; const take=(o,k,v)=>{ o[k]=v; changed=true; };
  for(const cid of Object.keys(b.courses||{})){ const bc=b.courses[cid]; const oc=out.courses[cid]=out.courses[cid]||{classes:{},exams:{},sources:{}};
    for(const i of Object.keys(bc.classes||{})){ const bk=bc.classes[i],ok=oc.classes[i]; if(!ok||(bk._t||0)>(ok._t||0)) take(oc.classes,i,bk); }
    for(const k of Object.keys(bc.exams||{})){ const be=bc.exams[k],oe=oc.exams[k]; if(!oe||(be._t||0)>(oe._t||0)) take(oc.exams,k,be); }
    oc.sources=oc.sources||{}; for(const n of Object.keys(bc.sources||{})){ const bs=bc.sources[n]; const os=oc.sources[n]=oc.sources[n]||{entries:{},t:{}}; os.t=os.t||{}; const keys=new Set([...Object.keys(bs.entries||{}),...Object.keys(bs.t||{})]); for(const i of keys){ const bt=(bs.t||{})[i]||0, ot=os.t[i]||0; if(!(i in os.entries)&&!os.t[i]||bt>ot){ if(bs.entries&&bs.entries[i]!=null) os.entries[i]=bs.entries[i]; else delete os.entries[i]; os.t[i]=bt; changed=true; } }
      const ikeys=new Set([...Object.keys(bs.it||{}),...Object.keys(bs.items||{}).flatMap(i=>Object.keys(bs.items[i]).map(id=>i+"/"+id))]); if(ikeys.size){ os.items=os.items||{}; os.it=os.it||{}; }
      for(const key of ikeys){ const [i,id]=key.split("/"); const bt=(bs.it||{})[key]||0, ot=os.it[key]||0; const bv=bs.items&&bs.items[i]?bs.items[i][id]:undefined; const have=os.items[i]&&id in os.items[i]; if(!have&&!os.it[key]||bt>ot){ os.items[i]=os.items[i]||{}; if(bv!=null) os.items[i][id]=bv; else delete os.items[i][id]; os.it[key]=bt; changed=true; } }
      Object.keys(os.items||{}).forEach(i=>{ if(!Object.keys(os.items[i]).length) delete os.items[i]; }); if(os.items&&!Object.keys(os.items).length) delete os.items;
      if(!Object.keys(os.entries).length&&!os.items) delete oc.sources[n]; }
    if(bc.plan&&(!oc.plan||(bc.plan._t||0)>(oc.plan._t||0))) take(oc,"plan",bc.plan);
    for(const k of Object.keys(bc.debates||{})){ oc.debates=oc.debates||{}; const bd=bc.debates[k],od=oc.debates[k]; if(!od||(bd._t||0)>(od._t||0)) take(oc.debates,k,bd); }
    for(const k of Object.keys(bc.orals||{})){ oc.orals=oc.orals||{}; const bo=bc.orals[k],oo=oc.orals[k]; if(!oo||(bo._t||0)>(oo._t||0)) take(oc.orals,k,bo); }
    if(bc.quotes){ oc.quotes=oc.quotes||[]; for(const q of bc.quotes){ const j=oc.quotes.findIndex(x=>x.id===q.id); if(j<0){ oc.quotes.push(q); changed=true; } else if((q._t||0)>(oc.quotes[j]._t||0)){ oc.quotes[j]=q; changed=true; } } }
    if(bc.marks){ oc.marks=oc.marks||{}; for(const n of Object.keys(bc.marks)){ const bm=bc.marks[n], om=oc.marks[n]; if(!om||(bm._t||0)>(om._t||0)) take(oc.marks,n,bm); } } }
  out.chat=out.chat||{}; for(const k of Object.keys(b.chat||{})){ if(!out.chat[k]||(b.chat[k]||[]).length>out.chat[k].length) take(out.chat,k,b.chat[k]); }
  out.review=out.review||{cards:{}}; out.review.cards=out.review.cards||{}; for(const id of Object.keys((b.review||{}).cards||{})){ const bc=b.review.cards[id],oc=out.review.cards[id]; if(!oc||(bc._t||0)>(oc._t||0)) take(out.review.cards,id,bc); }
  out.capstones=out.capstones||{}; for(const id of Object.keys(b.capstones||{})){ const bc=b.capstones[id],oc=out.capstones[id]; if(!oc||(bc._t||0)>(oc._t||0)) take(out.capstones,id,bc); }
  if(b.writing&&(b.writing._t||0)>((out.writing||{})._t||0)) take(out,"writing",b.writing);
  if(b.ui&&!out.ui) out.ui=b.ui;
  out.custom=out.custom||{}; for(const id of Object.keys(b.custom||{})){ const bc=b.custom[id],oc=out.custom[id]; if(!oc||(bc._t||0)>(oc._t||0)) take(out.custom,id,bc); }
  out.log=out.log||{}; for(const k of Object.keys(b.log||{})){ const bl=b.log[k],ol=out.log[k]; if(!ol||(bl.s||0)>(ol.s||0)) take(out.log,k,{s:Math.max(bl.s||0,(ol||{}).s||0),_t:Math.max(bl._t||0,(ol||{})._t||0)}); }
  out.profile=out.profile||{notes:[]}; out.profile.notes=out.profile.notes||[]; for(const n of ((b.profile||{}).notes||[])){ const j=out.profile.notes.findIndex(x=>x.id===n.id); if(j<0){ out.profile.notes.push(n); changed=true; } else if((n._t||0)>(out.profile.notes[j]._t||0)){ out.profile.notes[j]=n; changed=true; } }
  out.meta=out.meta||{}; out.meta.updatedAt=Math.max(out.meta.updatedAt||0,(b.meta||{}).updatedAt||0); out._changed=changed; return out; }
let SYNCING=false, SYNCSTATE={status:ghToken()?"idle":"off",at:0,msg:""};
function setSync(status,msg){ SYNCSTATE={status,at:now(),msg:msg||""}; const el=$("#syncdot"); if(el){ el.className="syncdot "+status; el.title=msg||status; } }
let RERENDER=false;
async function syncNow(){ if(!ghToken()||SYNCING) return; SYNCING=true; setSync("busy","Syncing…"); let changed=false; try{ const remote=await remoteState(); if(remote){ mergeInto(S,remote); changed=!!S._changed; delete S._changed; installCustom(); localStorage.setItem(LS,JSON.stringify(S)); }
    const body={description:"The Seminar — study state (private)",public:false,files:{"the-seminar-state.json":{content:JSON.stringify(S)}}}; const id=localStorage.getItem(GISTKEY); if(id){ await gh("PATCH","/gists/"+id,{files:body.files}); } else { const g=await gh("POST","/gists",body); localStorage.setItem(GISTKEY,g.id); }
    setSync("ok","Synced "+new Date().toLocaleTimeString()); if(changed){ const tag=(document.activeElement&&document.activeElement.tagName||"").toLowerCase(); if(tag==="textarea"||tag==="input") RERENDER=true; else route(); } } catch(e){ setSync("err",errMsg(e)); } finally{ SYNCING=false; } }

function timelineSVG(course){ const ys=YEARS[course.id]||[]; const sp=SPANS[course.id]||[]; const known=ys.map((y,i)=>[y,i]).filter(x=>x[0]!=null);
  if(!known.length) return ""; let lo=Math.min(...known.map(x=>x[0]),...sp.map(x=>x[0])), hi=Math.max(...known.map(x=>x[0]),...sp.map(x=>x[1])); const pad=(hi-lo)*0.03; lo-=pad; hi+=pad;
  const W=1000,L=16,R=16,x=y=>L+(y-lo)/(hi-lo)*(W-L-R); const nx=nextClass(course.id);

  // ticks: 6 round-number ticks

  // dots, staggered when crowded
  const sorted=known.slice().sort((p,q)=>p[0]-q[0]); let lastX=-99, row=0, dots=""; const ROWS=[84,108,132];
  sorted.forEach(([y,i])=>{ const px=x(y); row=(px-lastX<28)?(row+1)%3:0; lastX=px; const cy=ROWS[row]; const done=classDone(course.id,i), cur=i===nx;
    dots+=`<a href="#/c/${course.id}/${i+1}"><line x1="${px.toFixed(1)}" y1="52" x2="${px.toFixed(1)}" y2="${cy-9}" stroke="var(--rule)"/><circle cx="${px.toFixed(1)}" cy="${cy}" r="${cur?9:8}" fill="${done?"var(--ink)":"var(--paper)"}" stroke="${cur?"var(--accent)":"var(--ink)"}" stroke-width="${cur?2.5:1}"/><text x="${px.toFixed(1)}" y="${cy+3.5}" text-anchor="middle" font-size="9.5" fill="${done?"var(--paper)":"var(--ink)"}">${i+1}</text><title>Class ${i+1} · ${esc(course.classes[i].title)} · ${yearLabel(y)}</title></a>`; });

function timelineList(course){ const ys=YEARS[course.id]||[]; const nx=nextClass(course.id); const rows=ys.map((y,i)=>[y,i]).filter(x=>x[0]!=null).sort((p,q)=>p[0]-q[0]||p[1]-q[1]);

function renderCourse(course){ bar(`Course ${String(course.order).padStart(2,"0")} · <b>${esc(course.title)}</b>`,course); const c=cstate(course.id); const pl=plan(course.id); const nx=nextClass(course.id); const ys=YEARS[course.id]||[]; const themes=ys.map((y,i)=>y==null?i:null).filter(i=>i!=null);

  <section class="sec"><h3>The timeline</h3><p class="hint" style="margin-bottom:8px">Where each class sits in the story. Filled circles are classes you have finished; the one outlined in color is next. Tap a class to open it.</p><div class="ctlwrap">${timelineSVG(course)}</div>${timelineList(course)}${themes.length?`<p class="hint">Outside the chronology, taken at the end: ${themes.map(i=>`<a href="#/c/${course.id}/${i+1}" style="text-decoration:underline">Class ${i+1}, ${esc(course.classes[i].title.split(/[:;,]/)[0])}</a>`).join(" · ")}.</p>`:""}</section>

function renderClasses(course){ bar(`${esc(course.title)} · <b>Classes</b>`,course); const c=cstate(course.id); const nx=nextClass(course.id);

    $$(".qc").forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); const i=+b.dataset.i; const [d,n]=fieldCount(course,i,b.dataset.qc); setField(course,i,b.dataset.qc,d<n); renderClasses(course); }); }

function renderQuotes(course,q){ bar(`${esc(course.title)} · <b>Quotations</b>`,course); q=(q||"").trim().toLowerCase(); const all=liveQuotes(course.id).slice().sort((a,b)=>(b.at||0)-(a.at||0)); const list=q?all.filter(x=>(x.text+" "+x.src+" "+x.cite).toLowerCase().includes(q)):all;

  ${srcs.map(n=>`<section class="sec"><h3>${esc(n)} <span class="hint">${by[n].length}</span></h3><div class="qlist">${by[n].map(x=>`<blockquote class="qq" data-id="${x.id}"><p>${esc(x.text)}</p><footer>${x.cite?esc(x.cite)+" · ":""}${x.i!=null?`<a href="#/c/${course.id}/${x.i+1}">Class ${x.i+1}</a> · `:""}${fmtDate(x.at)} · <button class="minb" data-qedit="${x.id}">edit</button> · <button class="minb" data-qdel="${x.id}">remove</button></footer></blockquote>`).join("")}</div></section>`).join("")}${!srcs.length&&q?`<p class="empty">No quotations match.</p>`:""}`);

function nbMode(){ S.ui=S.ui||{}; return S.ui.nbMode||"write"; }
function renderNotebook(course,only,q){ bar(`${esc(course.title)} · <b>Notebook</b>`,course); const src=sources(course.id); S.ui=S.ui||{}; const mode=nbMode(); q=(q||"").trim().toLowerCase();
  const S0=n=>src[n]||{entries:{},t:{}}; const names=[...new Set([...Object.keys(src).filter(n=>hasAnyNotes(src[n])),...liveQuotes(course.id).filter(q=>q.i!=null).map(q=>q.src)])].sort((a,b)=>a.localeCompare(b));
  const total=n=>sourceWords(S0(n))+quotesFor(course.id,n,null).reduce((x,q)=>x+words(q.text),0);
  const tmax=n=>Math.max(0,...Object.values(S0(n).t||{}),...Object.values(S0(n).it||{}),...quotesFor(course.id,n,null).map(q=>q._t||0));
  const newest=names.slice().sort((a,b)=>tmax(b)-tmax(a))[0];
  const sel=only&&names.includes(only)?only:(only==="all"?"all":(newest||names[0]||null));
  const list=sel==="all"?names:(sel?[sel]:[]);
  const matches=(n,i)=>!q||sourceClassText(course.id,n,i,course).toLowerCase().includes(q)||n.toLowerCase().includes(q)||quotesFor(course.id,n,i).some(x=>x.text.toLowerCase().includes(q));
  const idxsOf=n=>[...new Set([...noteIdxs(S0(n)),...quoteIdxs(course.id,n)])].sort((a,b)=>a-b); const cls=n=>idxsOf(n).length;
  let side=`<div class="nbside"><input type="search" id="nbq" placeholder="Search this notebook" value="${esc(q)}"><a class="nbs ${sel==="all"?"on":""}" href="#/c/${course.id}/notebook/all">All sources <span>${names.length}</span></a>${names.map(n=>`<a class="nbs ${sel===n?"on":""}" href="#/c/${course.id}/notebook/${encodeURIComponent(n)}">${esc(n)} <span>${cls(n)}</span></a>`).join("")}${names.length?"":`<p class="hint" style="padding:10px 0">Nothing yet. Write in a class under a source and it collects here.</p>`}</div>`;
  let main=`<div class="nbmain"><div class="nbhead"><div><div class="k">${esc(course.title)}</div><h1>${sel==="all"?"Everything":(sel?esc(sel):"Notebook")}</h1>${sel&&sel!=="all"?`<div class="hint">${cls(sel)} class${cls(sel)===1?"":"es"} · ${total(sel)} words</div>`:(sel==="all"?`<div class="hint">${names.reduce((x,n)=>x+total(n),0)} words across ${names.length} sources</div>`:"")}</div>
  <div class="row nbtools"><button class="btn ghost small ${mode==="write"?"on":""}" data-mode="write">Write</button><button class="btn ghost small ${mode==="read"?"on":""}" data-mode="read">Read</button><button class="btn ghost small" id="focus">Focus</button>${sel&&sel!=="all"?`<button class="btn ghost small" id="copy">Copy</button>`:""}<button class="btn ghost small" id="dl">.md</button></div></div>`;
  const entry=(n,i)=>{ const its=itemNotes(course.id,n,i); const g=getNote(course.id,n,i);
    const ql=quoteList(course.id,n,i); if(mode==="read") return `<div class="prose nbread">${md(sourceClassText(course.id,n,i,course))}</div>${ql}`;
    const tb=(id)=>`<div class="row nrow"><button class="minb" data-nbtidy="${esc(n)}|${i}|${esc(id||"")}">Tidy</button></div>`;
    return its.map(x=>`<div class="srcl">${esc(itemLabel(course,i,x.id))}</div><textarea class="ta auto" data-nbi="${esc(x.id)}" data-nb="${esc(n)}" data-i="${i}">${esc(x.text)}</textarea>${tb(x.id)}`).join("")+(its.length?`<div class="srcl">${g.trim()?"General":"General (empty)"}</div>`:"")+((g.trim()||!its.length)?`<textarea class="ta auto" data-nb="${esc(n)}" data-i="${i}">${esc(g)}</textarea>${g.trim()?tb(""):""}`:`<button class="minb" data-addg="${esc(n)}" data-i="${i}">Add a general note</button>`)+ql; };
  for(const n of list){ const idxs=idxsOf(n).filter(i=>matches(n,i)); if(!idxs.length) continue;
    main+=`<section class="nbsrc">${sel==="all"?`<h2>${esc(n)}</h2>`:""}${idxs.map(i=>`<article class="nbe"><a class="nbk" href="#/c/${course.id}/${i+1}">Class ${i+1} · ${esc(course.classes[i].title)}</a>${entry(n,i)}</article>`).join("")}</section>`; }
  if(sel&&!list.some(n=>idxsOf(n).some(i=>matches(n,i)))) main+=`<p class="empty">No notes match.</p>`;
  main+=`</div>`;
  $("#app").innerHTML=coursePage(course,"notebook",`<div class="nbwrap">${side}${main}</div>`);
  const nbq=$("#nbq"); nbq.oninput=()=>{ renderNotebook(course,only,nbq.value); const n2=$("#nbq"); n2.focus(); n2.setSelectionRange(n2.value.length,n2.value.length); };
  $$("button[data-mode]").forEach(b=>b.onclick=()=>{ S.ui.nbMode=b.dataset.mode; save(); renderNotebook(course,only,q); });
  $("#focus").onclick=()=>{ document.body.classList.toggle("focus"); };
  const plain=(n,i)=>itemNotes(course.id,n,i).map(x=>`${itemLabel(course,i,x.id)}\n${x.text}`).concat(getNote(course.id,n,i).trim()?[getNote(course.id,n,i)]:[]).concat(quotesFor(course.id,n,i).map(x=>`"${x.text}"${x.cite?" ("+x.cite+")":""}`)).join("\n\n");
  if($("#copy")) $("#copy").onclick=()=>{ const txt=idxsOf(sel).map(i=>`Class ${i+1} · ${course.classes[i].title}\n${plain(sel,i)}`).join("\n\n"); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied"),()=>toast("Could not copy")); };
  $("#dl").onclick=()=>{ let out=`# ${course.title} — notebook${sel&&sel!=="all"?" — "+sel:""}\n\n`; for(const n of list){ out+=`## ${n}\n\n`; idxsOf(n).forEach(i=>{ out+=`### Class ${i+1} · ${course.classes[i].title}\n\n${sourceClassText(course.id,n,i,course)}\n\n${quotesFor(course.id,n,i).map(x=>`> ${x.text.replace(/\n/g,"\n> ")}\n>\n> — ${x.cite||""}\n\n`).join("")}`; }); } download(`${course.id}-notebook${sel&&sel!=="all"?"-"+sel.replace(/[^a-z0-9]+/gi,"-").toLowerCase():""}.md`,out,"text/markdown"); };
  $$("textarea[data-nb]:not([data-nbi])").forEach(ta=>ta.oninput=()=>setNote(course.id,ta.dataset.nb,+ta.dataset.i,ta.value));
  $$("textarea[data-nbi]").forEach(ta=>ta.oninput=()=>setItemNote(course.id,ta.dataset.nb,+ta.dataset.i,ta.dataset.nbi,ta.value));

  $$("button[data-addg]").forEach(b=>b.onclick=()=>{ const ta=document.createElement("textarea"); ta.className="ta auto"; ta.dataset.nb=b.dataset.addg; ta.dataset.i=b.dataset.i; ta.oninput=()=>setNote(course.id,ta.dataset.nb,+ta.dataset.i,ta.value); b.replaceWith(ta); growAll(ta.parentElement); ta.focus(); });
  $$("[data-qdel]").forEach(b=>b.onclick=async()=>{ if(await confirmBox("Remove this quotation?","Remove")){ deleteQuote(course.id,b.dataset.qdel); renderNotebook(course,only,q); } });
  growAll(); }
function portfolioMarkdown(course){ const c=cstate(course.id); const src=sources(course.id); let out=`# ${course.title} — portfolio\n\n${course.subtitle}\n\n`;
  const g=courseGrade(course.id); if(g.overall!=null) out+=`Grade: ${letter(g.overall)} (${Math.round(g.overall)})\n\n`;
  const names=Object.keys(src).filter(n=>hasAnyNotes(src[n])).sort(); if(names.length){ out+=`## Notes, by source\n\n`; for(const n of names){ out+=`### ${n}\n\n`; noteIdxs(src[n]).forEach(i=>{ out+=`**Class ${i+1} · ${course.classes[i].title}**\n\n${sourceClassText(course.id,n,i,course)}\n\n`; }); } }
  const qs=liveQuotes(course.id); if(qs.length){ out+=`## Quotations\n\n`; qs.forEach(q=>{ out+=`> ${q.text.replace(/\n/g,"\n> ")}\n>\n> — ${q.src}${q.cite?", "+q.cite:""}${q.i!=null?` (Class ${q.i+1})`:""}\n\n`; }); }
  for(let i=0;i<25;i++){ const k=c.classes[i]; if(!k) continue; const parts=[];
    if(typeof k.assign.score==="number") parts.push(`#### Assignment · ${k.assign.letter||letter(k.assign.score)} (${Math.round(k.assign.score)})\n\n*${(k.gen.assignment||{}).prompt||""}*\n\n${k.assign.answer}\n\n> ${(k.assign.feedback||"").replace(/\n/g,"\n> ")}\n`);
    if(typeof k.hw.score==="number") parts.push(`#### Homework · ${k.hw.letter||letter(k.hw.score)} (${Math.round(k.hw.score)})\n\n*${(k.gen.homework||{}).prompt||""}*\n\n${k.hw.answer}\n\n> ${(k.hw.feedback||"").replace(/\n/g,"\n> ")}\n`);
    const qs=(k.gen.discussion||{}).questions||[]; (k.discArchive||[]).forEach(ar=>{ (ar.disc||[]).forEach((d,qi)=>{ if(d&&d.thread&&d.thread.length) parts.push(`#### Earlier discussion ${qi+1}: ${(ar.questions||[])[qi]||""}\n\n`+d.thread.map(m=>`**${m.role==="user"?STUDENT:"Professor"}:** ${m.content}`).join("\n\n")+"\n\n"); }); }); k.disc.forEach((d,qi)=>{ if(d.thread&&d.thread.length) parts.push(`#### Discussion ${qi+1}: ${qs[qi]||""}\n\n`+d.thread.map(m=>`**${m.role==="user"?STUDENT:"Professor"}:** ${m.content}`).join("\n\n")+"\n"); });
    if(parts.length) out+=`## Class ${i+1} · ${course.classes[i].title}\n\n${parts.join("\n")}\n`; }
  return out; }

function showCard(list,n,total){ if(n>=list.length){ $("#app").innerHTML=`<div class="lead"><h1>Done</h1><div class="sub">${list.length} card${list.length===1?"":"s"} reviewed · ${total} in the deck</div></div><div class="panel"><a class="btn ghost small" href="#/">Home</a></div>`; bar(`<b>Review</b>`); return; }

function renderTimeline(){ bar(`<b>Timeline</b>`); const MIN=-3300,MAX=2000,W=1000,ROW=34,L=170; const x=y=>L+(y-MIN)/(MAX-MIN)*(W-L-20); const H=COURSES.length*ROW+60;
  const ticks=[-3000,-2500,-2000,-1500,-1000,-500,0,500,1000,1500,2000]; const fmtY=y=>y<0?`${-y} BC`:`AD ${y}`;
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:inherit">`;
  ticks.forEach(t=>{ svg+=`<line x1="${x(t)}" y1="20" x2="${x(t)}" y2="${H-30}" stroke="var(--rule)" stroke-width="1"/><text x="${x(t)}" y="14" font-size="11" fill="var(--ink-3)" text-anchor="middle">${fmtY(t)}</text>`; });
  COURSES.forEach((c,ri)=>{ const y=40+ri*ROW; const sp=SPANS[c.id]||[]; const col=colorFor(c); svg+=`<text x="${L-10}" y="${y+14}" font-size="12" fill="var(--ink)" text-anchor="end">${esc(c.title)}</text>`;
    sp.forEach((s,wi)=>{ if(wi===3&&s[0]===sp[0][0]) return; const from=wi*7,to=Math.min(24,from+6); let done=0; for(let i=from;i<=to;i++) if(classDone(c.id,i)) done++; const op=done?0.35+0.65*done/(to-from+1):0.22; svg+=`<a href="#/c/${c.id}/${from+1}"><rect x="${x(s[0])}" y="${y+4}" width="${Math.max(3,x(s[1])-x(s[0]))}" height="18" fill="${col}" opacity="${op}"><title>${esc(c.title)} · Week ${wi+1}: ${esc(c.weeks[wi].title)} · ${done}/${to-from+1} classes done</title></rect></a>`; }); });
  svg+=`</svg>`;
  $("#app").innerHTML=`<div class="lead"><div class="k" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase"><a href="#/">← Home</a></div><h1>Timeline</h1><div class="sub">Each bar is a week of a course, placed in the years it covers. Darker means more of its classes are done. Tap a bar to open that week. The thematic last weeks of the Near East and Egypt are folded into their spans.</div></div><div class="panel"><div class="tl">${svg}</div>
  <div class="sec" style="margin-top:20px"><h3>Who was alive when</h3><div class="prose"><p>Confucius (551–479 BC) and the Buddha (c. 480–400 BC) are contemporaries of Cyrus's grandson and of Cleisthenes' Athens. The Qin unification (221 BC) falls in the year Hannibal was planning his war; the Han fall (220) as the Roman crisis begins. Muhammad's Hijra (622) is the year Heraclius marched against Khosrow II. Charlemagne, Harun al-Rashid, and the Tang's Xuanzong share the decades around 800. Mansa Musa's pilgrimage (1324) and Ibn Battuta's travels (1325–54) overlap the Black Death and the Palaiologan civil wars. Babur takes Delhi (1526) the year Suleiman wins Mohács; Akbar, Elizabeth I, and Hideyoshi rule at once. Cook dies at Kealakekua Bay (1779) the year the East India Company is swallowing Bengal and the American war is in its fourth year.</p></div></div></div>`; }

function renderSearch(q){ bar(`<b>Search</b>`); const hits=[]; const needle=(q||"").trim().toLowerCase();
  if(needle){ COURSES.forEach(c=>{ liveQuotes(c.id).forEach(q=>{ if((q.text+" "+q.src+" "+q.cite).toLowerCase().includes(needle)) hits.push({c,i:q.i,kind:"quotation · "+q.src,text:q.text}); }); }); COURSES.forEach(c=>{ const cs=cstate(c.id); Object.keys(cs.sources||{}).forEach(n=>noteIdxs(cs.sources[n]).forEach(i=>{ const t=sourceClassText(c.id,n,i,c); if(t.toLowerCase().includes(needle)) hits.push({c,i,kind:"note · "+n,text:t}); }));
    for(let i=0;i<25;i++){ const k=cs.classes[i]; if(!k) continue; if((k.assign.answer||"").toLowerCase().includes(needle)) hits.push({c,i,kind:"assignment",text:k.assign.answer}); if((k.hw.answer||"").toLowerCase().includes(needle)) hits.push({c,i,kind:"homework",text:k.hw.answer}); k.disc.forEach((d,qi)=>(d.thread||[]).forEach(m=>{ if(m.content.toLowerCase().includes(needle)) hits.push({c,i,kind:(m.role==="user"?"you":"professor")+" · discussion "+(qi+1),text:m.content}); })); if((k.gen.lecture||"").toLowerCase().includes(needle)) hits.push({c,i,kind:"briefing",text:k.gen.lecture}); } });
    Object.entries(S.chat||{}).forEach(([key,thread])=>thread.forEach(m=>{ if(m.content.toLowerCase().includes(needle)){ const [cid,i]=key.split(":"); const c=COURSES.find(x=>x.id===cid); hits.push({c,i:i!=null?+i:null,kind:(m.role==="user"?"you":"professor")+" · office hours",text:m.content}); } })); }
  const snip=t=>{ const j=t.toLowerCase().indexOf(needle); const a=Math.max(0,j-80),b=Math.min(t.length,j+needle.length+120); return (a>0?"…":"")+esc(t.slice(a,j))+"<mark>"+esc(t.slice(j,j+needle.length))+"</mark>"+esc(t.slice(j+needle.length,b))+(b<t.length?"…":""); };
  $("#app").innerHTML=`<div class="lead"><div class="k" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase"><a href="#/">← Home</a></div><h1>Search</h1><div class="field" style="margin-top:12px"><input id="q" type="search" placeholder="Search every note, essay, discussion, and office-hours thread" value="${esc(q||"")}"></div></div><div class="panel">${needle?(hits.length?hits.map(h=>`<a class="hit" href="${h.c?`#/c/${h.c.id}${h.i!=null?"/"+(h.i+1):""}`:"#/"}"><div class="k">${h.c?esc(h.c.title):"General"}${h.i!=null?` · Class ${h.i+1}`:""} · ${esc(h.kind)}</div><div>${snip(h.text)}</div></a>`).join(""):`<p class="empty">Nothing matches.</p>`):`<p class="empty">Type to search.</p>`}</div>`;
  const inp=$("#q"); inp.focus(); inp.onkeydown=e=>{ if(e.key==="Enter") nav("/search/"+encodeURIComponent(inp.value)); }; }

  const useWhisper=!!oaKey()&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&!!window.MediaRecorder;

      rec.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop()); const blob=new Blob(chunks,{type:rec.mimeType||mime||"audio/webm"}); rec=null; btn.textContent="Transcribing…"; btn.disabled=true; try{ const text=await transcribe(blob,blob.type); if(text){ const base=ta.value; ta.value=base+(base&&!/[\s]$/.test(base)?" ":"")+text; ta.dispatchEvent(new Event("input")); onchange(); } }catch(e){ toast(errMsg(e)); } btn.textContent="Dictate"; btn.disabled=false; };
      rec.start(); btn.textContent="Stop"; }; return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ btn.style.display="none"; return; } let rec=null;
  btn.onclick=()=>{ if(rec){ rec.stop(); return; } rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang="en-US"; let base=ta.value; let finalT="";
    rec.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) finalT+=t+" "; else interim+=t; } ta.value=base+(base&&!base.endsWith("\n")&&!base.endsWith(" ")?" ":"")+finalT+interim; onchange(); };
    rec.onend=()=>{ rec=null; btn.textContent="Dictate"; onchange(); }; rec.onerror=()=>{ rec=null; btn.textContent="Dictate"; }; rec.start(); btn.textContent="Stop"; }; }

function logStore(){ S.log=S.log||{}; return S.log; }
function addTime(cid,seconds,day){ const L=logStore(); const k=(day||dayKey())+"|"+(cid||"-"); L[k]=L[k]||{s:0,_t:0}; L[k].s+=seconds; L[k]._t=now(); }
function tickLog(){ try{ if(document.visibilityState!=="visible") return; if(now()-LASTINPUT>4*60*1000) return; const m=ROUTE.match(/^\/c\/([^/]+)/); if(!m) return; addTime(m[1],15); if(Math.random()<0.25) save(); }catch(e){} }
setInterval(tickLog,15000);
function logTotals(){ const L=logStore(); const byCourse={},byDay={}; let all=0; for(const k of Object.keys(L)){ const [day,cid]=k.split("|"); const s=L[k].s||0; all+=s; byCourse[cid]=(byCourse[cid]||0)+s; byDay[day]=(byDay[day]||0)+s; } return {byCourse,byDay,all}; }
function hm(s){ const m=Math.round(s/60); if(m<60) return m+" min"; return (m/60).toFixed(m%60?1:0)+" h"; }

function profileText(){ const ns=profileNotes().sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,3); return ns.map(n=>`[After ${(COURSES.find(c=>c.id===n.cid)||{}).title||n.cid}] ${n.text}`).join("\n\n"); }
async function writeProfileNote(course){ const c=cstate(course.id); const g=courseGrade(course.id); const fb=[]; for(let i=0;i<25;i++){ const k=c.classes[i]; if(!k) continue; [["assignment",k.assign],["homework",k.hw]].forEach(([kind,r])=>{ if(typeof r.score==="number") fb.push(`Class ${i+1} ${kind} ${Math.round(r.score)}: strengths ${(r.strengths||[]).join("; ")}; to improve ${(r.improvements||[]).join("; ")}`); }); }
  const deb=Object.entries(c.debates||{}).map(([q,d])=>d.text?`Debate ${+q+1}: ${d.text.slice(0,600)}`:"").filter(Boolean).join("\n"); const quotes=liveQuotes(course.id).length; const words=Object.values(sources(course.id)).reduce((x,s)=>x+sourceWords(s),0);

  const user=`Grades: ${Object.entries(g.parts).filter(([k,v])=>typeof v==="number").map(([k,v])=>`${k} ${Math.round(v)}`).join(", ")}; overall ${g.overall!=null?Math.round(g.overall):"none yet"}.\nClasses finished: ${courseProgress(course.id)} of 25. Notes written: about ${words} words. Quotations saved: ${quotes}.\nFeedback given during the course:\n${fb.slice(0,40).join("\n")||"(none)"}\n${deb?`Her running answers to the course debates:\n${deb}\n`:""}${profileText()?`Your earlier notes on her:\n${profileText()}\n`:""}\nWrite 150–220 words, in the second person about yourself ("remind yourself that..."), plain prose, no headings: what she does well, what she keeps missing, what she seems drawn to, and how to push her next time. Be specific; refer to sources and habits, not generalities.`;
  const text=(await claude(sys,[{role:"user",content:user}],{max:900})).trim(); S.profile=S.profile||{notes:[]}; S.profile.notes=S.profile.notes||[]; const old=S.profile.notes.find(n=>n.cid===course.id&&!n.del); if(old){ old.text=text; old.at=now(); old._t=now(); } else S.profile.notes.push({id:"p"+now().toString(36),cid:course.id,text,at:now(),_t:now()}); save(); return text; }

/* debate journal: a running answer to each of the course's open questions, with every version kept */
function debateState(cid){ const c=cstate(cid); return c.debates=c.debates||{}; }
function debateQs(course){ return (window.DEBATES||{})[course.id]||[]; }
function saveDebate(cid,q,text){ const D=debateState(cid); const d=D[q]=D[q]||{text:"",versions:[],_t:0}; if((d.text||"").trim()&&text.trim()!==d.text.trim()){ d.versions=d.versions||[]; d.versions.push({text:d.text,at:d.at||now()}); if(d.versions.length>20) d.versions.shift(); } d.text=text; d.at=now(); d._t=now(); save(); }
async function respondDebate(course,q){ const qs=debateQs(course); const d=debateState(course.id)[q]||{}; const sys=professorSystem(course,null); const user=`The course asks: "${qs[q]}"\n\nThe student's running answer, revised ${(d.versions||[]).length} time${(d.versions||[]).length===1?"":"s"} over the course:\n${d.text}\n\nRespond as her professor in 200–320 words of markdown: where her answer is strong, where the evidence is thin or the counter-case is unmet, which sources from the course she should bring in, and the one question she should answer next. ${gradeMode()==="content"?"Do not comment on prose.":""} No score.`;
  const text=await claude(sys,[{role:"user",content:user}],{max:1400}); const D=debateState(course.id); D[q]=D[q]||{text:"",versions:[]}; D[q].response={text,at:now(),answer:d.text}; D[q]._t=now(); save(); return text; }

    ${d.response?`<div class="sec" style="margin-top:12px"><h3>Professor's response <span class="hint">${fmtDate(d.response.at)}${d.response.answer!==d.text?" · to an earlier version":""}</span></h3><div class="prose">${md(d.response.text)}</div></div>`:""}

  bindNotes(document,key=>{ const q=+key.split("|")[2]; return {get:()=>(D[q]||{}).text||"",set:v=>saveDebate(course.id,q,v)}; },()=>renderDebates(course));
